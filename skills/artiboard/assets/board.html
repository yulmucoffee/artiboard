<title>Project Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* artiboard — shared task board for people and their Claude agents.
   Everything on screen is drawn by this page's code from the board's database (tasks, details, notices, meta/config, meta/rules),
   so updates cost no model tokens. People, language, repositories and labels come from meta/config; edit that doc, not this file.
   Layout: document view (now, recent activity, notices, notes, people, items, rules; every section folds), kanban, dependency graph.
   Each person keeps one color everywhere. The theme (auto, light, dark) is the viewer's choice, kept in this browser. */
:root{
  --bg:#F7F7F8; --surface:#FFFFFF; --sunk:#F1F1F3; --ink:#18181B; --text2:#52525B; --muted:#71717A;
  --line:#E4E4E7; --line-soft:#EEEEF0; --edge:#D4D4D8; --scrim:rgba(24,24,27,.28);
  --accent:#2563EB; --on-accent:#FFFFFF; --accent-soft:#EBF1FE;
  --p0:#1D4ED8; --p0-bar:#3B82F6; --p0-soft:#E6EEFE;
  --p1:#15803D; --p1-bar:#22A35A; --p1-soft:#E3F4E9;
  --p2:#B45309; --p2-bar:#EA8A1E; --p2-soft:#FCEFDD;
  --p3:#6D28D9; --p3-bar:#8B5CF6; --p3-soft:#F0EAFD;
  --p4:#0F766E; --p4-bar:#14A39A; --p4-soft:#DEF3F1;
  --p5:#BE185D; --p5-bar:#E64B8B; --p5-soft:#FCE7F0;
  --c6:#CA8A04; --c7:#64748B;
  --warn:#B45309; --warn-soft:#FDF1E1; --danger:#DC2626; --danger-soft:#FDECEC;
  --agent:#7C3AED; --agent-soft:#F1EBFE;
  --s-todo:#A1A1AA; --s-doing:#3B82F6; --s-review:#8B5CF6; --s-blocked:#EF4444; --s-done:#22A35A;
  --shadow:0 1px 2px rgba(24,24,27,.05); --shadow-hi:0 4px 14px rgba(24,24,27,.08);
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI","Malgun Gothic","Hiragino Sans","PingFang SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1A1A1D; --sunk:#151517; --ink:#EDEDEF; --text2:#B4B4BC; --muted:#8B8B94;
  --line:#2A2A2F; --line-soft:#222226; --edge:#3B3B42; --scrim:rgba(0,0,0,.5);
  --accent:#60A5FA; --on-accent:#0B1220; --accent-soft:#172238;
  --p0:#93B8FF; --p0-bar:#5B8DF6; --p0-soft:#18233A;
  --p1:#7FD0A0; --p1-bar:#3FB872; --p1-soft:#13281C;
  --p2:#F5B26B; --p2-bar:#E8913A; --p2-soft:#302110;
  --p3:#C4B1FA; --p3-bar:#9D7BF5; --p3-soft:#251E3C;
  --p4:#74D3CC; --p4-bar:#2DB3A9; --p4-soft:#102927;
  --p5:#F59BC0; --p5-bar:#E7639A; --p5-soft:#371826;
  --c6:#E2B93B; --c7:#94A3B8;
  --warn:#F0B35C; --warn-soft:#30230F; --danger:#F87171; --danger-soft:#3A1B1B;
  --agent:#C4B1FA; --agent-soft:#261F3A;
  --s-todo:#63636B; --s-doing:#5B8DF6; --s-review:#9D7BF5; --s-blocked:#F87171; --s-done:#3FB872;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hi:0 4px 14px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1A1A1D; --sunk:#151517; --ink:#EDEDEF; --text2:#B4B4BC; --muted:#8B8B94;
  --line:#2A2A2F; --line-soft:#222226; --edge:#3B3B42; --scrim:rgba(0,0,0,.5);
  --accent:#60A5FA; --on-accent:#0B1220; --accent-soft:#172238;
  --p0:#93B8FF; --p0-bar:#5B8DF6; --p0-soft:#18233A;
  --p1:#7FD0A0; --p1-bar:#3FB872; --p1-soft:#13281C;
  --p2:#F5B26B; --p2-bar:#E8913A; --p2-soft:#302110;
  --p3:#C4B1FA; --p3-bar:#9D7BF5; --p3-soft:#251E3C;
  --p4:#74D3CC; --p4-bar:#2DB3A9; --p4-soft:#102927;
  --p5:#F59BC0; --p5-bar:#E7639A; --p5-soft:#371826;
  --c6:#E2B93B; --c7:#94A3B8;
  --warn:#F0B35C; --warn-soft:#30230F; --danger:#F87171; --danger-soft:#3A1B1B;
  --agent:#C4B1FA; --agent-soft:#261F3A;
  --s-todo:#63636B; --s-doing:#5B8DF6; --s-review:#9D7BF5; --s-blocked:#F87171; --s-done:#3FB872;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hi:0 4px 14px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:650;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-size:14.5px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)}
/* the board's heading, the tabs and the document view stay on a centered 1180 px column, so a line keeps an easy
   length and nothing stretches across a wide window; only the kanban and the graph grow past it when their columns
   need the room */
.page{display:flex;flex-direction:column;gap:28px}
header.top,#viewDoc>section,footer{width:100%;max-width:1180px;margin-inline:auto}
.board{display:flex;flex-direction:column;gap:28px;min-width:0}
.view{display:flex;flex-direction:column;gap:36px;min-width:0}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sec-head p{color:var(--muted);font-size:13.5px}
.sec-head .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
/* a section folds from its heading; the choice is remembered in this browser */
.fold{display:inline-flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;color:inherit;text-align:left}
.fold::before{content:"";flex:none;width:7px;height:7px;border-right:1.75px solid var(--muted);border-bottom:1.75px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.fold[aria-expanded="false"]::before{transform:translateY(0) rotate(-45deg)}
.fold:hover h2,.fold:hover .gname{text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:4px}
.fold .n{font-size:13px;color:var(--muted);font-weight:500}
section.folded>.sec-body,section.folded>.sec-head p{display:none}
section.folded{gap:0}
.morebtn{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--accent);font-size:13px;font-weight:500}
.morebtn:hover{text-decoration:underline;text-underline-offset:3px}
.lede{color:var(--text2);max-width:68ch}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500}

/* person colors: one class per palette slot */
.who.p0{--pc:var(--p0);--pb:var(--p0-bar);--ps:var(--p0-soft)}
.who.p1{--pc:var(--p1);--pb:var(--p1-bar);--ps:var(--p1-soft)}
.who.p2{--pc:var(--p2);--pb:var(--p2-bar);--ps:var(--p2-soft)}
.who.p3{--pc:var(--p3);--pb:var(--p3-bar);--ps:var(--p3-soft)}
.who.p4{--pc:var(--p4);--pb:var(--p4-bar);--ps:var(--p4-soft)}
.who.p5{--pc:var(--p5);--pb:var(--p5-bar);--ps:var(--p5-soft)}
.p0{--pc:var(--p0);--pb:var(--p0-bar);--ps:var(--p0-soft)} .p1{--pc:var(--p1);--pb:var(--p1-bar);--ps:var(--p1-soft)}
.p2{--pc:var(--p2);--pb:var(--p2-bar);--ps:var(--p2-soft)} .p3{--pc:var(--p3);--pb:var(--p3-bar);--ps:var(--p3-soft)}
.p4{--pc:var(--p4);--pb:var(--p4-bar);--ps:var(--p4-soft)} .p5{--pc:var(--p5);--pb:var(--p5-bar);--ps:var(--p5-soft)}

/* header */
header.top{display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.repos{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.repo{display:inline-flex;align-items:center;gap:6px;min-height:26px;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:0 10px 0 8px;color:var(--text2);text-decoration:none;background:var(--surface);max-width:100%}
.repo:hover{border-color:var(--edge);color:var(--ink)}
.repo svg{flex:none;color:var(--muted)}
.repo b{font-weight:600;color:var(--ink)}
.repo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:7px;background:var(--sunk);border:1px solid var(--line-soft)}
.seg button{border:0;background:transparent;border-radius:5px;min-height:26px;padding:0 10px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.progress{display:flex;gap:2px;height:6px;border-radius:99px;overflow:hidden;background:var(--line-soft)}
.progress span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* sticky toolbar: it spans the window, so what scrolls under it never shows beside it, while its content stays on
   the heading's column */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);left:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;align-self:flex-start;width:var(--vw,100%);max-width:none;margin:-6px 0 0 calc(-1 * var(--page-l,0px));padding:10px var(--col-r,0px) 10px var(--col-l,0px);border-bottom:1px solid var(--line)}
.toolbar .seg button{min-height:30px;padding:0 14px;font-size:13px}
.search{flex:1 1 220px;max-width:360px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 6px 0 10px;min-height:34px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:0;min-height:32px;outline:0}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:transparent;color:var(--muted);width:24px;height:24px;border-radius:5px;font-size:16px;line-height:1}
.newbtn{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--text2)}
.newbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.newbtn:disabled{cursor:default;color:var(--muted)}
.result{font-size:12.5px;color:var(--muted)}
.hint{margin-left:auto;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface);color:var(--text2)}
@media (max-width:820px){.hint{display:none}}
/* a site admin's project menu ends the toolbar, so it stays in reach while the board scrolls */
.projmenu{position:relative;margin-left:auto}
@media (min-width:821px){.hint~.projmenu{margin-left:0}}
.kebab{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted)}
.kebab:hover,.kebab[aria-expanded="true"]{background:var(--sunk);color:var(--ink)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:6;display:flex;flex-direction:column;min-width:180px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-hi)}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink);white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--sunk)}
.menu .danger{color:var(--danger)}

/* chips */
.who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap;color:var(--pc,var(--muted));background:var(--ps,var(--sunk))}
.who::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.who.none{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.who.none::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2);white-space:nowrap;line-height:20px;--sc:var(--s-todo)}
.state::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--sc)}
.state.todo{display:inline-flex} /* not the lane list .todo */
.state.todo::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sc)}
.state.doing{--sc:var(--s-doing)} .state.review{--sc:var(--s-review)} .state.blocked{--sc:var(--s-blocked);color:var(--danger)} .state.done{--sc:var(--s-done)}
.tag{font-size:12px;color:var(--text2);white-space:nowrap}
.key{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.agent-mark{font-size:11.5px;font-weight:600;color:var(--agent);background:var(--agent-soft);border-radius:4px;padding:0 6px;white-space:nowrap;line-height:19px}
/* an agent that posted in the last half hour */
.agent-mark.live{display:inline-flex;align-items:center;gap:5px}
.agent-mark.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--agent);animation:ab-pulse 1.6s ease-in-out infinite}
@keyframes ab-pulse{0%,100%{opacity:1}50%{opacity:.2}}
.dot-new{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* now */
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}
/* now: who holds what as one line of people, then what needs hands and what is free, one plain row each */
.np-row{display:flex;flex-wrap:wrap;gap:8px}
.np{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--sunk);font-size:13px;color:var(--text2);min-width:0}
.np i{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-style:normal;font-size:11.5px;font-weight:700;color:var(--pc,var(--muted));background:var(--ps,var(--line-soft))}
.np b{color:var(--ink);font-weight:600}
.np.mine{box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.np.none i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge)}
.subhead{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--text2)}
.subhead .n{color:var(--muted);font-weight:400}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.rows>li{display:grid;grid-template-columns:96px 72px minmax(0,1fr) auto minmax(0,auto);gap:4px 12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line-soft);font-size:13.5px;min-width:0}
.rows>li:first-child{border-top:0}
.rows>li:hover{background:var(--sunk)}
.rows.ready>li{grid-template-columns:72px minmax(0,1fr) minmax(0,auto) auto}
.why{justify-self:start;font-size:12px;font-weight:600;border-radius:5px;padding:1px 8px;white-space:nowrap}
.why.alert{color:var(--danger);background:var(--danger-soft)}
.why.review{color:var(--s-review);background:color-mix(in srgb,var(--s-review) 14%,transparent)}
.why.soon{color:var(--warn);background:var(--warn-soft)}
.rows .t{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rows .t:hover{text-decoration:underline;text-underline-offset:3px}
.rows .side{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden}
a.prlink{font-size:13px}
@media (max-width:640px){.rows>li,.rows.ready>li{grid-template-columns:auto minmax(0,1fr)}.rows .t{grid-column:1/-1;white-space:normal}.rows .side{justify-content:flex-start;flex-wrap:wrap;white-space:normal}.rows.ready .side{grid-column:1/-1}}
.btn{min-height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{border-color:transparent;background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.06)}
.btn.small{min-height:26px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.empty{color:var(--muted);font-size:13.5px}
/* a muted line where something has nothing to show yet */
.aside{font-size:13.5px}

/* people lanes */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.lane{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--pb,var(--line));border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lane .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.lane .head strong{font-size:18px;color:var(--pc,var(--ink))}
.lane .head .me{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.todo li{display:grid;gap:2px;min-width:0}
.todo .t{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.todo button.link{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.45}
.todo button.link:hover{text-decoration:underline;text-underline-offset:3px}
.todo .d{font-size:13px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.lane .foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:10px}

/* item table */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:28px;padding:0 12px;font-size:13px;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.toggle{margin-left:auto;border-style:dashed}
.chip.toggle[aria-pressed="true"]{border-style:solid}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
thead th{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;white-space:nowrap;background:var(--sunk)}
thead th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
thead th button:hover,thead th[aria-sort] button{color:var(--ink)}
thead th[aria-sort="ascending"] button::after{content:"↑"}
thead th[aria-sort="descending"] button::after{content:"↓"}
tbody tr.group th{background:var(--bg);font-size:13px;font-weight:700;color:var(--text2);padding-block:8px;border-bottom:1px solid var(--line)}
tbody tr.group th .fold{font-weight:700;color:var(--text2)}
tbody tr.group th .n{font-weight:400;color:var(--muted)}
tbody tr.item{cursor:pointer}
tbody tr.item:hover td{background:var(--sunk)}
tbody tr.item[aria-current="true"] td{background:var(--accent-soft)}
tbody tr.item.cursor td{background:var(--sunk)}
tbody tr.item.cursor td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody tr:last-child td{border-bottom:0}
td.keycell{padding-top:11px;white-space:nowrap}
td.keycell .dot-new{margin-left:6px;vertical-align:1px}
td.what{min-width:280px}
td.what button{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.45}
td.what .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
td.deps{min-width:110px;font-size:13px}
td.deps .ok{color:var(--muted)}
td.deps .wait{color:var(--warn);font-weight:600}
td.when{white-space:nowrap;font-size:13px;color:var(--muted)}
td.date{white-space:nowrap}
.me-fixed{font-weight:600;padding:0 6px}
.dates{display:inline-flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.date{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.date.today,.date.slow{color:var(--warn);font-weight:600}
.date.late{color:var(--danger);font-weight:600}
td.date .arrow{color:var(--muted);font-size:12px;margin-right:6px}
.repotag{font-family:var(--f-mono);font-size:11.5px;color:var(--text2);background:var(--sunk);border-radius:4px;padding:0 6px;line-height:19px;white-space:nowrap}
.lane .done-list summary{cursor:pointer}
.lane .done-list ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.lane .done-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.lane .done-list button.link{background:none;border:0;padding:0;text-align:left;color:var(--text2);line-height:1.45}
.lane .done-list button.link:hover{text-decoration:underline;text-underline-offset:3px}

/* recent activity: the last message on the tasks touched most recently */
.activity{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.activity li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 16px;padding:11px 18px;border-bottom:1px solid var(--line-soft);align-items:start}
.activity li:last-child{border-bottom:0}
.activity .at{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.activity .head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.activity .head button{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.45}
.activity .head button:hover{text-decoration:underline;text-underline-offset:3px}
.activity .line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13.5px;color:var(--text2);margin-top:3px}
.activity .line .text{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity .line.quiet{color:var(--muted);font-size:13px}

/* notices */
.feed{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.feed li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 16px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
.feed li:last-child{border-bottom:0}
.feed li.new{background:var(--accent-soft)}
.feed .at{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.feed .at .when{display:flex;align-items:center;gap:6px}
.feed .at .by{display:flex;gap:4px;flex-wrap:wrap}
.feed .text{white-space:pre-wrap;overflow-wrap:anywhere}
.feed li.form{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:0 0 12px 12px}
.feed li.more{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:10px}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--p1-bar)}
.live.off{color:var(--warn)}
.live.off::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
textarea,select,input[type=text],input[type=url]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:32px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical;line-height:1.5}
.form-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rule h3{display:flex;gap:10px;align-items:baseline}
.rule h3 .num{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.rule ul{margin:0;padding-left:1.15em;display:grid;gap:4px;font-size:13.5px;color:var(--text2)}
.rule p{font-size:13.5px;color:var(--text2)}
.rule li,.rule p{overflow-wrap:anywhere}
.rules-note{font-size:13px;color:var(--muted)}
#rulesText,#notesText{min-height:260px;font-size:13.5px}
.guide .rule{background:var(--bg)}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
.back{font-size:13px;color:var(--muted);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}

/* kanban: the page itself scrolls both ways, so a wheel or a swipe anywhere moves it and no box traps the scroll.
   The board grows to the columns' width, which leaves the toolbar room to stick to the window's left edge, and column
   headers stick right under the toolbar. Columns keep
   one width or take two card columns. A card is two lines: what it is with who has it (or that it is free) at the
   right, then its title. */
body[data-view="kanban"] .board{width:max-content;min-width:100%}
.kanban{--colw:296px;padding-bottom:12px}
/* the kanban and the graph sit in the window's middle, at least as wide as the heading's column and wider when their
   columns need it; their descriptions wrap to that width instead of setting it */
#viewKanban>section,#viewGraph>section{width:fit-content;min-width:min(100%,1180px);max-width:100%;margin-inline:auto}
#viewKanban .sec-head p,#viewGraph .sec-head p,.gbar{contain:inline-size}
#viewKanban .sec-head p,#viewGraph .sec-head p{flex:1 1 320px}
/* arrows at the edges move a wide kanban or graph about a screen sideways, for a mouse without a sideways wheel; each
   shows while there is more on its side, halfway down the part of the board in view. Touch screens swipe instead. */
.pan{position:fixed;z-index:4;width:36px;height:36px;margin-top:-18px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-hi);display:grid;place-items:center}
.pan:hover{border-color:var(--edge)}
.pan[hidden]{display:none}
@media (pointer:coarse){.pan{display:none}}
/* a touch browser meets a page wider than the screen by widening its layout viewport, which unpins the toolbar, so
   there the board swipes sideways in its own box and only the vertical scroll is the page's */
@media (pointer:coarse){
  body[data-view="kanban"] .board{width:auto}
  .kanban{overflow-x:auto;overscroll-behavior-x:contain}
}
.cols{display:flex;gap:12px;align-items:flex-start;width:max-content;padding-inline-end:max(16px,env(safe-area-inset-right,0px))}
.col{flex:none;width:var(--colw);background:var(--sunk);border-radius:12px;display:flex;flex-direction:column}
.col.two{width:calc(var(--colw) * 2 + 8px)}
.col h3{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tb-h,0px));z-index:2;display:flex;gap:8px;align-items:center;padding:10px 8px 8px 14px;font-size:13px;background:var(--sunk);border-radius:12px 12px 0 0}
.col h3 .state{font-size:13px;color:var(--ink)}
.col h3 .n{color:var(--muted);font-weight:500;font-size:12.5px}
.col h3 .tools{margin-left:auto;display:flex;gap:2px}
.colbtn{border:0;background:transparent;color:var(--muted);border-radius:6px;min-width:26px;height:26px;padding:0 6px;font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.colbtn:hover{background:var(--line-soft);color:var(--ink)}
.colbtn[aria-pressed="true"]{color:var(--accent)}
.colbtn.sure{color:var(--danger);background:var(--danger-soft)}
.col.arch{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.col.arch h3{background:var(--bg)}
.cards{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.cards>.empty{padding:4px 4px 8px}
.cards>.arch-hint{padding:0 4px 4px;font-size:12px;line-height:1.5}
/* two equal tracks that never grow past the column: a title with a long path or link in it wraps inside its card
   instead of widening its track under the next column */
.col.two .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.col.two .cards>p,.col.two .cards>.morebtn{grid-column:1/-1}
.card{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--tb-h,0px) + 52px);text-align:left;width:100%;background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:box-shadow .12s,border-color .12s}
.card:hover{border-color:var(--edge);box-shadow:var(--shadow-hi)}
.card.cursor{outline:2px solid var(--accent);outline-offset:1px}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .top{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--muted);min-height:20px}
.card .top .key{font-size:11.5px}
.card .top .feat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .top .right{margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex:none;max-width:62%}
.card .flag{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--muted)}
.card .flag.ready{color:var(--accent);font-weight:600}
.card .flag.wait,.card .flag.soon{color:var(--warn)}
.card .flag.late{color:var(--danger);font-weight:600}
.card .title{font-weight:600;line-height:1.38;font-size:13.5px;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.done .title{color:var(--text2);font-weight:500}
.card.done{box-shadow:none;background:transparent;border-color:var(--line)}
/* finished work is looked up, not worked on: one line each, so a column holds about three times as many */
.card.line{flex-direction:row;align-items:center;gap:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
.card.line .key{flex:none;font-size:11.5px}
.card.line .title{flex:1;min-width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.card.line .when{flex:none}
.cards .morebtn{align-self:center;padding:4px 0}
.sheet .acts{margin-top:4px}
/* the owner as a round initial in their color; a ring when an agent has it, pulsing while it is posting */
.av{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);min-width:0}
.av i{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-style:normal;font-size:11px;font-weight:700;color:var(--pc,var(--muted));background:var(--ps,var(--sunk))}
.av.agent i{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--agent)}
.av.live i{animation:ab-ring 1.6s ease-in-out infinite}
@keyframes ab-ring{50%{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px transparent}}
.av span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.solo{gap:0}

/* dependency graph */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.crit{font-size:13.5px;color:var(--text2)}
.crit b{color:var(--ink)}
.crit .path{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);overflow-wrap:anywhere}
/* the page does not anchor its scroll inside the graph, so zooming it keeps the page still */
.graph-wrap{overflow:auto;overflow-anchor:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:min(78vh,900px)}
.graph-wrap>.empty{padding:16px}
.graph{position:relative;margin-inline:auto}
.graph svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gcol{position:absolute;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.gcol span{font-weight:400}
.node{position:absolute;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pb,var(--edge));border-radius:8px;padding:7px 10px 8px;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:opacity .15s}
.node:hover{border-color:var(--edge);border-left-color:var(--pb,var(--edge))}
.node.blocked{border-top-color:var(--danger);border-right-color:var(--danger);border-bottom-color:var(--danger)}
.node.done{background:var(--sunk)}
.node.done .tt{color:var(--muted)}
.node.oncrit{box-shadow:0 0 0 2px var(--accent)}
.node.cursor{outline:2px solid var(--ink);outline-offset:3px}
.node[aria-current="true"]{background:var(--accent-soft)}
.node .r1{flex:none;display:flex;align-items:center;gap:6px;min-width:0}
.node .r1 .dot-new{margin-left:auto}
.node .tt{flex:none;font-size:12.5px;font-weight:600;line-height:1.4;max-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .r3{flex:none;margin-top:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .r3.ready{color:var(--accent);font-weight:600}
.graph path.e{fill:none;stroke:var(--edge);stroke-width:1.5;transition:opacity .15s}
.graph path.e.met{stroke:var(--muted)}
.graph path.e.crit{stroke:var(--accent);stroke-width:2.5}
.graph path.e.hi{stroke:var(--ink);stroke-width:2}
.graph path.e.crit.hi{stroke:var(--accent)}
.graph marker path{stroke:none}
.graph .m-line{fill:var(--edge)} .graph .m-met{fill:var(--muted)} .graph .m-crit{fill:var(--accent)} .graph .m-hi{fill:var(--ink)}
.graph.focus .node:not(.hi){opacity:.28}
.graph.focus path.e:not(.hi){opacity:.12}
.graph .node.nomatch{opacity:.25}
.legend i.swatch{display:inline-block;width:18px;height:0;border-radius:0;background:none;border-top:2px solid;vertical-align:4px;margin-right:6px}
.legend i.lg-crit{border-color:var(--accent)}
.legend i.lg-met{border-color:var(--muted)}
.legend i.lg-wait{border-color:var(--edge)}

/* detail sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:11;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.08);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet .bar{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px 0 20px;border-bottom:1px solid var(--line-soft)}
.sheet .bar .nav{display:flex;gap:2px;margin-left:auto}
.sheet .bar .nav button,.sheet .bar .x{border:0;background:transparent;color:var(--muted);min-width:32px;height:32px;border-radius:6px;font-size:13px;line-height:1}
.sheet .bar .x{font-size:20px}
/* a question that takes one answer is the same dialog, small and in the middle */
.sheet.confirm{top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;padding:0;box-shadow:var(--shadow-hi)}
.sheet.confirm .body{gap:12px}
.sheet.confirm .acts{display:flex;justify-content:flex-end;gap:8px}
.btn.danger{border-color:transparent;background:var(--danger);color:var(--on-accent)}
.sheet .bar .nav button:hover,.sheet .bar .x:hover{background:var(--sunk)}
.sheet .bar .nav button:disabled{opacity:.4;cursor:default}
.sheet .body{flex:1;overflow-y:auto;padding:18px 20px 12px;display:flex;flex-direction:column;gap:18px}
.sheet h2{font-size:18px;line-height:1.4}
.sheet .bar h2{font-size:15px}
.sheet .bar .spacer{margin-left:auto}
.setform{display:flex;flex-direction:column;gap:14px}
.setform label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.setform input,.setform textarea{width:100%;font-weight:400;color:var(--ink)}
.setform textarea{min-height:110px;font-family:var(--f-mono);font-size:13px}
.setform .hint2{font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.5}
.setform .fineprint{font-size:12.5px}
.fields{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:13.5px}
.fields .k{color:var(--muted);font-size:13px;font-weight:600}
.fields select,.fields input{width:100%}
.block{display:flex;flex-direction:column;gap:6px}
.block h3{font-size:13px;color:var(--muted);font-weight:600}
.block h3.summary-head{display:flex;gap:8px;align-items:baseline}
.summary-head .summary-at{font-weight:400}
.sheet-tags{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.deps-pending{color:var(--warn);font-size:13.5px}
.claim-line{font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tell{font-size:13px;display:inline-flex;gap:6px;align-items:center}
.block .pre{white-space:pre-wrap;overflow-wrap:anywhere}
.deplist{display:flex;flex-wrap:wrap;gap:6px}
.deplist button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:13px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line-soft)}
.msg.agent{background:var(--agent-soft);border-color:transparent}
.msg.new{box-shadow:inset 3px 0 0 var(--accent)}
.msg .h{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.msg .h .new-mark{color:var(--accent);font-weight:600}
.msg .text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.type{font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;line-height:19px;color:var(--text2);background:var(--sunk)}
.type.question{color:var(--warn);background:var(--warn-soft)}
.type.blocker{color:var(--danger);background:var(--danger-soft)}
.type.handoff{color:var(--accent);background:var(--accent-soft)}
.sheet .composer{border-top:1px solid var(--line-soft);padding:12px 20px 16px;display:flex;flex-direction:column;gap:8px}
.composer .send-hint{font-size:12px}
.err{color:var(--danger);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 14px;font-size:13.5px;max-width:calc(100% - 32px)}

/* code: what a task touches, the open tasks touching the same files, and the code map */
.touches{display:flex;flex-wrap:wrap;gap:6px}
.touch{display:inline-flex;align-items:center;gap:2px;max-width:100%;min-height:24px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-family:var(--f-mono);font-size:12px;color:var(--text2)}
.touch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.touch button{flex:none;border:0;background:none;color:var(--muted);width:20px;height:20px;margin-right:-6px;border-radius:4px;padding:0;line-height:1}
.touch button:hover{background:var(--line-soft);color:var(--ink)}
.overlap{font-size:11.5px;font-weight:600;color:var(--warn);white-space:nowrap}
td.what .overlap{margin-left:8px}
.overlaps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.overlaps button{background:none;border:0;padding:0;text-align:left;color:var(--warn);font-size:13px;overflow-wrap:anywhere}
.overlaps button:hover{text-decoration:underline;text-underline-offset:3px}
.code .form-row input{flex:1 1 200px}
.maplines{font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text2)}
.maplines:empty{display:none}
.maplines button{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.maplines button:hover{text-decoration:underline;text-underline-offset:3px}
.maplines .mapref{white-space:nowrap}
/* code map: the picture */
.cmaps{display:grid;gap:14px}
.cmap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cmap-head{display:flex;flex-direction:column;gap:3px}
.cmap-name{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;min-width:0}
.cmap-head h3{display:flex;gap:10px;align-items:baseline;overflow-wrap:anywhere}
.cmap-head .num{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.cmap-counts{font-size:12.5px;color:var(--muted)}
.cmap-head p{font-size:12.5px;color:var(--text2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.cmap-dirty{display:inline-block;padding:0 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:600}
.cmap-cmd{display:block;font-family:var(--f-mono);font-size:12px;background:var(--sunk);border-radius:6px;padding:6px 10px;overflow-wrap:anywhere;user-select:all;color:var(--text2)}
.cmap-none{display:flex;flex-direction:column;gap:8px}
.cmap-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cmap-tools .mapsearch{flex:1 1 220px}
.cmap-found{display:grid;gap:1px}
.cmap-found:empty{display:none}
.cmap-hit{background:none;border:0;padding:4px 6px;text-align:left;border-radius:6px;font-size:13px;display:flex;gap:8px;align-items:baseline;min-width:0;color:var(--ink)}
.cmap-hit:hover{background:var(--sunk)}
.cmap-hit span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:12.5px;color:var(--muted);min-height:26px}
.crumb button{background:none;border:0;padding:2px 5px;color:var(--accent);font-size:12.5px;border-radius:4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb button:hover{background:var(--sunk)}
.crumb b{color:var(--ink);font-weight:600;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .back{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500;margin-right:6px;border:1px solid var(--line);padding:1px 8px 1px 6px}
.crumb .back span{font-size:15px;line-height:1;margin-top:-2px}
.crumb .zoom{margin-left:auto;display:inline-flex;gap:1px}
.crumb .zoom button{color:var(--muted);min-width:24px;min-height:24px;text-align:center;border:1px solid transparent;padding:0 5px;font-size:12.5px;line-height:1}
.crumb .zoom button:hover{border-color:var(--line);color:var(--ink)}
/* a touch screen has no hover to show the zoom buttons are buttons, so their edges stay drawn */
@media (hover:none){.crumb .zoom button{border-color:var(--line)}}
.cmap-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.cmap-pane{display:flex;flex-direction:column;gap:8px;min-width:0}
.cmap-svg{position:relative;border:1px solid var(--line-soft);border-radius:8px;background:var(--bg);overflow:hidden;min-height:120px}
.cmap-svg .empty{padding:14px}
.cmap-pic{display:block;width:100%;height:440px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.cmap-pic:active{cursor:grabbing}
.cmap-pic:focus-visible{outline-offset:-2px}
.cmap-pic .e{fill:none;stroke:var(--edge);stroke-linecap:round;transition:opacity .12s}
.cmap-pic .e.calls{stroke-dasharray:4 3}
.cmap-pic .e.uses,.cmap-pic .e.mentions{stroke-dasharray:1.5 3}
.cmap-pic .e.mentions{opacity:.55}
.cmap-pic .e.defines,.cmap-pic .e.contains{stroke:var(--line-soft)}
.cmap-pic .e.extends{stroke:var(--text2)}
.cmap-pic .e.hi{stroke:var(--ink)}
.cmap-pic.focus .e:not(.hi){opacity:.15}
.cmap-pic.focus .cnode:not(.hi){opacity:.3}
.cmap-pic marker path{fill:var(--edge)}
.cmap-pic marker.hi path{fill:var(--ink)}
.cnode{cursor:pointer;transition:opacity .12s;outline:none}
.cnode .shape{fill:var(--ck,var(--edge));stroke:var(--surface);stroke-width:1.5}
.cnode.k-group .shape{fill-opacity:.88}
.cnode.port .shape{fill:var(--surface);stroke:var(--ck,var(--edge));stroke-width:2;stroke-dasharray:3 2}
.cnode.k-sym .shape{fill-opacity:.85}
.cnode.k-doc .shape{fill:var(--surface);stroke:var(--ck,var(--muted));stroke-width:1.75}
.cnode.faded{opacity:.45}
.cnode.sel .shape{stroke:var(--ink);stroke-width:2.5}
.cnode:focus-visible .shape{stroke:var(--accent);stroke-width:2.5}
.cnode .lbl{font-size:11px;fill:var(--text2);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.cnode.k-group .lbl{font-size:12px;font-weight:600;fill:var(--ink)}
.cnode.port .lbl{font-weight:500;fill:var(--muted)}
.cnode.center .lbl,.cnode.sel .lbl{font-weight:600;fill:var(--ink)}
.cnode .ring{fill:none;stroke:var(--pb,var(--warn));stroke-width:2}
.cnode .badge{font-size:9.5px;font-weight:700;fill:var(--pc,var(--warn));paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}
.ck0{--ck:var(--p0-bar)} .ck1{--ck:var(--p1-bar)} .ck2{--ck:var(--p2-bar)} .ck3{--ck:var(--p3-bar)} .ck4{--ck:var(--p4-bar)} .ck5{--ck:var(--p5-bar)} .ck6{--ck:var(--c6)} .ck7{--ck:var(--c7)}
.cmap-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);align-items:center}
.cmap-legend span{display:inline-flex;align-items:center;gap:5px}
.cmap-legend svg .shape{fill:var(--muted)} .cmap-legend svg .shape.doc{fill:none;stroke:var(--muted);stroke-width:1.5}
.cmap-legend svg .e{stroke:var(--muted);stroke-width:1.5} .cmap-legend svg .e.calls{stroke-dasharray:4 3} .cmap-legend svg .e.uses{stroke-dasharray:1.5 3} .cmap-legend svg .e.defines{stroke:var(--edge)}
.cmap-legend .cmap-help{margin-left:auto;flex:none;width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:99px;background:none;color:var(--muted);font-size:11px;font-weight:600;line-height:1}
.cmap-legend .cmap-help:hover,.cmap-legend .cmap-help[aria-expanded='true']{color:var(--ink);border-color:var(--text2)}
.cmap-legend .cmap-hint{flex-basis:100%;color:var(--muted)}
.cmap-legend .cmap-fail{flex-basis:100%;color:var(--danger)}
.cmap-detail{display:flex;flex-direction:column;gap:8px;min-width:0;font-size:13px}
.cmap-detail .cmap-title{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.cmap-detail .muted{font-size:12.5px;overflow-wrap:anywhere}
.cmap-detail .btn{align-self:flex-start}
.cmap-tasks{display:flex;flex-wrap:wrap;gap:6px}
.cmap-task{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:24px;padding:0 8px;border:1px solid var(--line);border-left:3px solid var(--pb,var(--edge));border-radius:6px;background:var(--surface);font-size:12px;color:var(--text2);overflow:hidden}
.cmap-task b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.cmap-task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:899px){.cmap-body{grid-template-columns:1fr}}
@media (max-width:560px){.cmap-pic{height:320px}.cmap{padding:12px 14px}}

@media (max-width:560px){
  body{font-size:14px;padding-block:20px 56px}
  h1{font-size:24px}
  .box,.lane{padding:16px}
  .toolbar{position:static}
  .feed li,.activity li{grid-template-columns:minmax(0,1fr)}
  .feed .at{flex-direction:row;flex-wrap:wrap;align-items:center}
}
@media (prefers-reduced-motion:reduce){.node,.graph path.e,.cnode,.cmap-pic .e{transition:none}.agent-mark.live::before{animation:none}}

<div class="page">
  <header class="top">
    <a class="back" id="backLink" href="/" hidden></a>
    <h1 id="hTitle">Project Board</h1>
    <p class="lede" id="hLede"></p>
    <div class="repos" id="repos" hidden></div>
    <div class="meta">
      <span id="mMilestone"></span>
      <span id="mCount"></span>
      <span id="mUpdated"></span>
      <span id="mLive" class="live" hidden></span>
      <span id="mArchived" class="tag" hidden></span>
      <span id="meWrap" style="display:inline-flex;align-items:center;gap:8px"><b id="meLabel"></b>
        <span class="seg" role="group" id="meSel"></span>
      </span>
      <span id="meNote" hidden></span>
      <button type="button" class="linkbtn" id="setBtn" hidden></button>
      <span class="seg" role="group" id="themeSel"></span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="board">
    <div class="toolbar" role="toolbar" id="toolbar">
      <div class="seg" role="tablist" id="tabs">
        <button type="button" role="tab" data-view="doc" aria-selected="false"></button>
        <button type="button" role="tab" data-view="kanban" aria-selected="false"></button>
        <button type="button" role="tab" data-view="graph" aria-selected="false"></button>
      </div>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="search" id="q" autocomplete="off">
        <button type="button" class="clear" id="qClear" hidden>×</button>
      </label>
      <span class="result" id="qResult"></span>
      <button type="button" class="newbtn" id="newBtn" aria-pressed="false"></button>
      <button type="button" class="newbtn" id="mineBtn" aria-pressed="false" hidden></button>
      <button type="button" class="linkbtn" id="readAll" hidden></button>
      <span class="hint" aria-hidden="true" id="hint"></span>
      <div class="projmenu" id="projMenu" hidden>
        <button type="button" class="kebab" id="projMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="projMenuList">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="13" r="1.5" fill="currentColor"/></svg>
        </button>
        <div class="menu" role="menu" id="projMenuList" hidden>
          <button type="button" role="menuitem" id="projShelve"></button>
          <button type="button" role="menuitem" class="danger" id="projDelete"></button>
        </div>
      </div>
    </div>

    <div class="view" id="viewDoc" hidden>
      <section data-fold="now">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-now"></h2><span class="n" id="nowN"></span></button><p id="nowSub"></p></div>
        <div class="sec-body"><div class="box" id="now"></div></div>
      </section>
      <section data-fold="activity">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-activity"></h2><span class="n" id="activityN"></span></button><p id="activitySub"></p></div>
        <div class="sec-body"><ul class="activity" id="activity"></ul></div>
      </section>
      <section data-fold="notices">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-notices"></h2><span class="n" id="noticesN"></span></button><p id="noticesSub"></p>
          <span class="tools"><button type="button" class="linkbtn" id="noticeRead" hidden></button></span></div>
        <div class="sec-body"><ul class="feed" id="feed"></ul></div>
      </section>
      <section data-fold="notes">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-notes"></h2><span class="n" id="notesN"></span></button><p id="notesSub"></p>
          <span class="tools"><button type="button" class="linkbtn" id="notesEdit" hidden></button></span></div>
        <div class="sec-body" id="notesBody"></div>
      </section>
      <section data-fold="people">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-people"></h2><span class="n" id="peopleN"></span></button><p id="peopleSub"></p></div>
        <div class="sec-body"><div class="lanes" id="lanes"></div></div>
      </section>
      <section data-fold="items">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-items"></h2><span class="n" id="itemsN"></span></button><p id="itemsSub"></p></div>
        <div class="sec-body">
          <div class="filters" id="filters" role="group"></div>
          <div class="scroll" tabindex="0">
            <table>
              <thead><tr id="thead"></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </section>
      <section data-fold="codemap">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-codemap"></h2></button><p id="codemapSub"></p></div>
        <div class="sec-body" id="codemapBody"></div>
      </section>
      <section data-fold="rules">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-rules"></h2><span class="n" id="rulesN"></span></button><p id="rulesSub"></p>
          <span class="tools"><button type="button" class="linkbtn" id="rulesEdit" hidden></button></span></div>
        <div class="sec-body" id="rulesBody"></div>
      </section>
      <section data-fold="guide">
        <div class="sec-head"><button type="button" class="fold"><h2 id="h-guide"></h2></button><p id="guideSub"></p></div>
        <div class="sec-body"><div class="rules guide" id="guide"></div></div>
      </section>
    </div>

    <div class="view" id="viewKanban" hidden>
      <section aria-labelledby="h-kanban">
        <div class="sec-head"><h2 id="h-kanban"></h2><p id="kanbanSub"></p></div>
        <div class="kanban" id="kanban"></div>
        <button type="button" class="pan" id="kanbanPrev" hidden></button>
        <button type="button" class="pan" id="kanbanNext" hidden></button>
      </section>
    </div>

    <div class="view" id="viewGraph" hidden>
      <section aria-labelledby="h-graph">
        <div class="sec-head"><h2 id="h-graph"></h2><p id="graphSub"></p></div>
        <div class="gbar">

          <div class="legend" id="glegend"></div>
        </div>
        <div class="graph-wrap" id="graphWrap" tabindex="0"></div>
        <button type="button" class="pan" id="graphPrev" hidden></button>
        <button type="button" class="pan" id="graphNext" hidden></button>
      </section>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

  var STR = I18N.en;
  function T(k, vars) {
    var s = STR[k] != null ? STR[k] : I18N.en[k] != null ? I18N.en[k] : k;
    if (typeof s !== 'string') return s;
    return s.replace(/\{(\w+)\}/g, function (_, v) {
