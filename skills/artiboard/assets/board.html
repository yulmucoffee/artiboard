<title>Project Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* artiboard — shared task board for people and their Claude agents.
   Everything on screen is drawn by this page's code from the board's database (tasks, details, notices, meta/config, meta/rules),
   so updates cost no model tokens. People, language, repositories and labels come from meta/config; edit that doc, not this file.
   Layout: document view (now, recent activity, notices, notes, people, items, rules; every section folds), kanban, dependency graph.
   Each person keeps one color everywhere. The theme (auto, light, dark) is the viewer's choice, kept in this browser. */
:root{
  --bg:#F7F7F8; --surface:#FFFFFF; --sunk:#F1F1F3; --ink:#18181B; --text2:#52525B; --muted:#71717A;
  --line:#E4E4E7; --line-soft:#EEEEF0; --edge:#D4D4D8; --scrim:rgba(24,24,27,.28);
  --accent:#2563EB; --on-accent:#FFFFFF; --accent-soft:#EBF1FE;
  --p0:#1D4ED8; --p0-bar:#3B82F6; --p0-soft:#E6EEFE;
  --p1:#15803D; --p1-bar:#22A35A; --p1-soft:#E3F4E9;
  --p2:#B45309; --p2-bar:#EA8A1E; --p2-soft:#FCEFDD;
  --p3:#6D28D9; --p3-bar:#8B5CF6; --p3-soft:#F0EAFD;
  --p4:#0F766E; --p4-bar:#14A39A; --p4-soft:#DEF3F1;
  --p5:#BE185D; --p5-bar:#E64B8B; --p5-soft:#FCE7F0;
  --warn:#B45309; --warn-soft:#FDF1E1; --danger:#DC2626; --danger-soft:#FDECEC;
  --agent:#7C3AED; --agent-soft:#F1EBFE;
  --s-todo:#A1A1AA; --s-doing:#3B82F6; --s-review:#8B5CF6; --s-blocked:#EF4444; --s-done:#22A35A;
  --shadow:0 1px 2px rgba(24,24,27,.05); --shadow-hi:0 4px 14px rgba(24,24,27,.08);
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI","Malgun Gothic","Hiragino Sans","PingFang SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --surface:#1A1A1D; --sunk:#151517; --ink:#EDEDEF; --text2:#B4B4BC; --muted:#8B8B94;
  --line:#2A2A2F; --line-soft:#222226; --edge:#3B3B42; --scrim:rgba(0,0,0,.5);
  --accent:#60A5FA; --on-accent:#0B1220; --accent-soft:#172238;
  --p0:#93B8FF; --p0-bar:#5B8DF6; --p0-soft:#18233A;
  --p1:#7FD0A0; --p1-bar:#3FB872; --p1-soft:#13281C;
  --p2:#F5B26B; --p2-bar:#E8913A; --p2-soft:#302110;
  --p3:#C4B1FA; --p3-bar:#9D7BF5; --p3-soft:#251E3C;
  --p4:#74D3CC; --p4-bar:#2DB3A9; --p4-soft:#102927;
  --p5:#F59BC0; --p5-bar:#E7639A; --p5-soft:#371826;
  --warn:#F0B35C; --warn-soft:#30230F; --danger:#F87171; --danger-soft:#3A1B1B;
  --agent:#C4B1FA; --agent-soft:#261F3A;
  --s-todo:#63636B; --s-doing:#5B8DF6; --s-review:#9D7BF5; --s-blocked:#F87171; --s-done:#3FB872;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hi:0 4px 14px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#1A1A1D; --sunk:#151517; --ink:#EDEDEF; --text2:#B4B4BC; --muted:#8B8B94;
  --line:#2A2A2F; --line-soft:#222226; --edge:#3B3B42; --scrim:rgba(0,0,0,.5);
  --accent:#60A5FA; --on-accent:#0B1220; --accent-soft:#172238;
  --p0:#93B8FF; --p0-bar:#5B8DF6; --p0-soft:#18233A;
  --p1:#7FD0A0; --p1-bar:#3FB872; --p1-soft:#13281C;
  --p2:#F5B26B; --p2-bar:#E8913A; --p2-soft:#302110;
  --p3:#C4B1FA; --p3-bar:#9D7BF5; --p3-soft:#251E3C;
  --p4:#74D3CC; --p4-bar:#2DB3A9; --p4-soft:#102927;
  --p5:#F59BC0; --p5-bar:#E7639A; --p5-soft:#371826;
  --warn:#F0B35C; --warn-soft:#30230F; --danger:#F87171; --danger-soft:#3A1B1B;
  --agent:#C4B1FA; --agent-soft:#261F3A;
  --s-todo:#63636B; --s-doing:#5B8DF6; --s-review:#9D7BF5; --s-blocked:#F87171; --s-done:#3FB872;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-hi:0 4px 14px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:650;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-size:14.5px;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.page{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
.view{display:flex;flex-direction:column;gap:36px;min-width:0}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sec-head p{color:var(--muted);font-size:13.5px}
.sec-head .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
/* a section folds from its heading; the choice is remembered in this browser */
.fold{display:inline-flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;color:inherit;text-align:left}
.fold::before{content:"";flex:none;width:7px;height:7px;border-right:1.75px solid var(--muted);border-bottom:1.75px solid var(--muted);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.fold[aria-expanded="false"]::before{transform:translateY(0) rotate(-45deg)}
.fold:hover h2,.fold:hover .gname{text-decoration:underline;text-decoration-color:var(--edge);text-underline-offset:4px}
.fold .n{font-size:13px;color:var(--muted);font-weight:500}
section.folded>.sec-body,section.folded>.sec-head p{display:none}
section.folded{gap:0}
.morebtn{align-self:flex-start;background:none;border:0;padding:2px 0;color:var(--accent);font-size:13px;font-weight:500}
.morebtn:hover{text-decoration:underline;text-underline-offset:3px}
.lede{color:var(--text2);max-width:68ch}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500}

/* person colors: one class per palette slot */
.who.p0{--pc:var(--p0);--pb:var(--p0-bar);--ps:var(--p0-soft)}
.who.p1{--pc:var(--p1);--pb:var(--p1-bar);--ps:var(--p1-soft)}
.who.p2{--pc:var(--p2);--pb:var(--p2-bar);--ps:var(--p2-soft)}
.who.p3{--pc:var(--p3);--pb:var(--p3-bar);--ps:var(--p3-soft)}
.who.p4{--pc:var(--p4);--pb:var(--p4-bar);--ps:var(--p4-soft)}
.who.p5{--pc:var(--p5);--pb:var(--p5-bar);--ps:var(--p5-soft)}
.p0{--pc:var(--p0);--pb:var(--p0-bar);--ps:var(--p0-soft)} .p1{--pc:var(--p1);--pb:var(--p1-bar);--ps:var(--p1-soft)}
.p2{--pc:var(--p2);--pb:var(--p2-bar);--ps:var(--p2-soft)} .p3{--pc:var(--p3);--pb:var(--p3-bar);--ps:var(--p3-soft)}
.p4{--pc:var(--p4);--pb:var(--p4-bar);--ps:var(--p4-soft)} .p5{--pc:var(--p5);--pb:var(--p5-bar);--ps:var(--p5-soft)}

/* header */
header.top{display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.repos{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.repo{display:inline-flex;align-items:center;gap:6px;min-height:26px;font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:0 10px 0 8px;color:var(--text2);text-decoration:none;background:var(--surface);max-width:100%}
.repo:hover{border-color:var(--edge);color:var(--ink)}
.repo svg{flex:none;color:var(--muted)}
.repo b{font-weight:600;color:var(--ink)}
.repo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:7px;background:var(--sunk);border:1px solid var(--line-soft)}
.seg button{border:0;background:transparent;border-radius:5px;min-height:26px;padding:0 10px;font-size:12.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.progress{display:flex;gap:2px;height:6px;border-radius:99px;overflow:hidden;background:var(--line-soft)}
.progress span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* sticky toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;border-bottom:1px solid var(--line);margin-top:-6px}
.toolbar .seg button{min-height:30px;padding:0 14px;font-size:13px}
.search{flex:1 1 220px;max-width:360px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 6px 0 10px;min-height:34px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:0;min-height:32px;outline:0}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:transparent;color:var(--muted);width:24px;height:24px;border-radius:5px;font-size:16px;line-height:1}
.newbtn{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--text2)}
.newbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.newbtn:disabled{cursor:default;color:var(--muted)}
.result{font-size:12.5px;color:var(--muted)}
.hint{margin-left:auto;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface);color:var(--text2)}
@media (max-width:820px){.hint{display:none}}

/* chips */
.who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap;color:var(--pc,var(--muted));background:var(--ps,var(--sunk))}
.who::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.who.none{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.who.none::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text2);white-space:nowrap;line-height:20px;--sc:var(--s-todo)}
.state::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--sc)}
.state.todo{display:inline-flex} /* not the lane list .todo */
.state.todo::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sc)}
.state.doing{--sc:var(--s-doing)} .state.review{--sc:var(--s-review)} .state.blocked{--sc:var(--s-blocked);color:var(--danger)} .state.done{--sc:var(--s-done)}
.tag{font-size:12px;color:var(--text2);white-space:nowrap}
.key{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.agent-mark{font-size:11.5px;font-weight:600;color:var(--agent);background:var(--agent-soft);border-radius:4px;padding:0 6px;white-space:nowrap;line-height:19px}
/* an agent that posted in the last half hour */
.agent-mark.live{display:inline-flex;align-items:center;gap:5px}
.agent-mark.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--agent);animation:ab-pulse 1.6s ease-in-out infinite}
@keyframes ab-pulse{0%,100%{opacity:1}50%{opacity:.2}}
.dot-new{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* now */
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:18px;min-width:0}
/* now: who holds what as one line of people, then what needs hands and what is free, one plain row each */
.np-row{display:flex;flex-wrap:wrap;gap:8px}
.np{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--sunk);font-size:13px;color:var(--text2);min-width:0}
.np i{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-style:normal;font-size:11.5px;font-weight:700;color:var(--pc,var(--muted));background:var(--ps,var(--line-soft))}
.np b{color:var(--ink);font-weight:600}
.np.mine{box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.np.none i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge)}
.subhead{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--text2)}
.subhead .n{color:var(--muted);font-weight:400}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.rows>li{display:grid;grid-template-columns:96px 72px minmax(0,1fr) auto minmax(0,auto);gap:4px 12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line-soft);font-size:13.5px;min-width:0}
.rows>li:first-child{border-top:0}
.rows>li:hover{background:var(--sunk)}
.rows.ready>li{grid-template-columns:72px minmax(0,1fr) minmax(0,auto) auto}
.why{justify-self:start;font-size:12px;font-weight:600;border-radius:5px;padding:1px 8px;white-space:nowrap}
.why.alert{color:var(--danger);background:var(--danger-soft)}
.why.review{color:var(--s-review);background:color-mix(in srgb,var(--s-review) 14%,transparent)}
.why.soon{color:var(--warn);background:var(--warn-soft)}
.rows .t{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rows .t:hover{text-decoration:underline;text-underline-offset:3px}
.rows .side{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:12.5px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden}
.rows .side a{font-size:12.5px}
@media (max-width:640px){.rows>li,.rows.ready>li{grid-template-columns:auto minmax(0,1fr)}.rows .t{grid-column:1/-1;white-space:normal}.rows .side{justify-content:flex-start}}
.btn{min-height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{border-color:transparent;background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.06)}
.btn.small{min-height:26px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.empty{color:var(--muted);font-size:13.5px}

/* people lanes */
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.lane{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--pb,var(--line));border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lane .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.lane .head strong{font-size:18px;color:var(--pc,var(--ink))}
.lane .head .me{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.todo li{display:grid;gap:2px;min-width:0}
.todo .t{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.todo button.link{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.45}
.todo button.link:hover{text-decoration:underline;text-underline-offset:3px}
.todo .d{font-size:13px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.lane .foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:10px}

/* item table */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:28px;padding:0 12px;font-size:13px;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.toggle{margin-left:auto;border-style:dashed}
.chip.toggle[aria-pressed="true"]{border-style:solid}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
thead th{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;white-space:nowrap;background:var(--sunk)}
thead th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
thead th button:hover,thead th[aria-sort] button{color:var(--ink)}
thead th[aria-sort="ascending"] button::after{content:"↑"}
thead th[aria-sort="descending"] button::after{content:"↓"}
tbody tr.group th{background:var(--bg);font-size:13px;font-weight:700;color:var(--text2);padding-block:8px;border-bottom:1px solid var(--line)}
tbody tr.group th .fold{font-weight:700;color:var(--text2)}
tbody tr.group th .n{font-weight:400;color:var(--muted)}
tbody tr.item{cursor:pointer}
tbody tr.item:hover td{background:var(--sunk)}
tbody tr.item[aria-current="true"] td{background:var(--accent-soft)}
tbody tr.item.cursor td{background:var(--sunk)}
tbody tr.item.cursor td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody tr:last-child td{border-bottom:0}
td.keycell{padding-top:11px;white-space:nowrap}
td.keycell .dot-new{margin-left:6px;vertical-align:1px}
td.what{min-width:280px}
td.what button{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.45}
td.what .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
td.deps{min-width:110px;font-size:13px}
td.deps .ok{color:var(--muted)}
td.deps .wait{color:var(--warn);font-weight:600}
td.when{white-space:nowrap;font-size:13px;color:var(--muted)}
td.date{white-space:nowrap}
.me-fixed{font-weight:600;padding:0 6px}
.dates{display:inline-flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.date{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.date.today,.date.slow{color:var(--warn);font-weight:600}
.date.late{color:var(--danger);font-weight:600}
td.date .arrow{color:var(--muted);font-size:12px;margin-right:6px}
.repotag{font-family:var(--f-mono);font-size:11.5px;color:var(--text2);background:var(--sunk);border-radius:4px;padding:0 6px;line-height:19px;white-space:nowrap}
.lane .done-list summary{cursor:pointer}
.lane .done-list ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.lane .done-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.lane .done-list button.link{background:none;border:0;padding:0;text-align:left;color:var(--text2);line-height:1.45}
.lane .done-list button.link:hover{text-decoration:underline;text-underline-offset:3px}

/* recent activity: the last message on the tasks touched most recently */
.activity{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.activity li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 16px;padding:11px 18px;border-bottom:1px solid var(--line-soft);align-items:start}
.activity li:last-child{border-bottom:0}
.activity .at{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.activity .head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.activity .head button{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);line-height:1.45}
.activity .head button:hover{text-decoration:underline;text-underline-offset:3px}
.activity .line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13.5px;color:var(--text2);margin-top:3px}
.activity .line .text{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.activity .line.quiet{color:var(--muted);font-size:13px}

/* notices */
.feed{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.feed li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 16px;padding:12px 18px;border-bottom:1px solid var(--line-soft)}
.feed li:last-child{border-bottom:0}
.feed li.new{background:var(--accent-soft)}
.feed .at{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.feed .text{white-space:pre-wrap;overflow-wrap:anywhere}
.feed li.form{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:0 0 12px 12px}
.feed li.more{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:10px}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--p1-bar)}
.live.off{color:var(--warn)}
.live.off::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
textarea,select,input[type=text],input[type=url]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:32px;min-width:0}
textarea{width:100%;min-height:64px;resize:vertical;line-height:1.5}
.form-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rule h3{display:flex;gap:10px;align-items:baseline}
.rule h3 .num{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.rule ul{margin:0;padding-left:1.15em;display:grid;gap:4px;font-size:13.5px;color:var(--text2)}
.rule p{font-size:13.5px;color:var(--text2)}
.rule li,.rule p{overflow-wrap:anywhere}
.rules-note{font-size:13px;color:var(--muted)}
#rulesText,#notesText{min-height:260px;font-size:13.5px}
.guide .rule{background:var(--bg)}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
.back{font-size:13px;color:var(--muted);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}

/* kanban: a board that fills the window and scrolls both ways inside it, like Notion's. Columns keep one width,
   fold to a strip or take two card columns; headers stay put while cards scroll. A card is two lines: what it is
   with who has it (or that it is free) at the right, then its title. */
.kanban{--colw:296px;overflow:auto;overscroll-behavior:contain;padding-bottom:12px}
.cols{display:flex;gap:12px;align-items:flex-start;width:max-content;min-height:100%}
.col{flex:none;width:var(--colw);background:var(--sunk);border-radius:12px;display:flex;flex-direction:column}
.col.two{width:calc(var(--colw) * 2 + 8px)}
.col h3{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 8px 8px 14px;font-size:13px;background:var(--sunk);border-radius:12px 12px 0 0}
.col h3 .state{font-size:13px;color:var(--ink)}
.col h3 .n{color:var(--muted);font-weight:500;font-size:12.5px}
.col h3 .tools{margin-left:auto;display:flex;gap:2px}
.colbtn{border:0;background:transparent;color:var(--muted);border-radius:6px;min-width:26px;height:26px;padding:0 6px;font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.colbtn:hover{background:var(--line-soft);color:var(--ink)}
.colbtn[aria-pressed="true"]{color:var(--accent)}
.colbtn.sure{color:var(--danger);background:var(--danger-soft)}
.col.folded{width:44px;cursor:pointer}
.col.folded h3{writing-mode:vertical-rl;padding:12px 0;align-items:center;justify-content:flex-start;gap:10px;border-radius:12px;min-height:180px}
.col.folded h3 .tools{margin:0}
.col.folded .cards{display:none}
.col.arch{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.col.arch h3{background:var(--bg)}
.cards{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.col.two .cards{display:grid;grid-template-columns:1fr 1fr;align-items:start}
.col.two .cards>p,.col.two .cards>.morebtn{grid-column:1/-1}
.card{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:box-shadow .12s,border-color .12s}
.card:hover{border-color:var(--edge);box-shadow:var(--shadow-hi)}
.card.cursor{outline:2px solid var(--accent);outline-offset:1px}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .top{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--muted);min-height:20px}
.card .top .key{font-size:11.5px}
.card .top .feat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .top .right{margin-left:auto;display:inline-flex;align-items:center;gap:6px;flex:none;max-width:62%}
.card .flag{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--muted)}
.card .flag.ready{color:var(--accent);font-weight:600}
.card .flag.wait,.card .flag.soon{color:var(--warn)}
.card .flag.late{color:var(--danger);font-weight:600}
.card .title{font-weight:600;line-height:1.38;font-size:13.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.done .title{color:var(--text2);font-weight:500}
.card.done{box-shadow:none;background:transparent;border-color:var(--line)}
.cards .morebtn{align-self:center;padding:4px 0}
.sheet .acts{margin-top:4px}
/* the owner as a round initial in their color; a ring when an agent has it, pulsing while it is posting */
.av{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);min-width:0}
.av i{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-style:normal;font-size:11px;font-weight:700;color:var(--pc,var(--muted));background:var(--ps,var(--sunk))}
.av.agent i{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--agent)}
.av.live i{animation:ab-ring 1.6s ease-in-out infinite}
@keyframes ab-ring{50%{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px transparent}}
.av span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av.solo{gap:0}

/* dependency graph */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.crit{font-size:13.5px;color:var(--text2)}
.crit b{color:var(--ink)}
.crit .path{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);overflow-wrap:anywhere}
.graph-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:min(78vh,900px)}
.graph{position:relative}
.graph svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.gcol{position:absolute;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.gcol span{font-weight:400}
.node{position:absolute;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pb,var(--edge));border-radius:8px;padding:7px 10px 8px;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:opacity .15s}
.node:hover{border-color:var(--edge);border-left-color:var(--pb,var(--edge))}
.node.blocked{border-top-color:var(--danger);border-right-color:var(--danger);border-bottom-color:var(--danger)}
.node.done{background:var(--sunk)}
.node.done .tt{color:var(--muted)}
.node.oncrit{box-shadow:0 0 0 2px var(--accent)}
.node.cursor{outline:2px solid var(--ink);outline-offset:3px}
.node[aria-current="true"]{background:var(--accent-soft)}
.node .r1{flex:none;display:flex;align-items:center;gap:6px;min-width:0}
.node .r1 .dot-new{margin-left:auto}
.node .tt{flex:none;font-size:12.5px;font-weight:600;line-height:1.4;max-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .r3{flex:none;margin-top:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .r3.ready{color:var(--accent);font-weight:600}
.graph path.e{fill:none;stroke:var(--edge);stroke-width:1.5;transition:opacity .15s}
.graph path.e.met{stroke:var(--muted)}
.graph path.e.crit{stroke:var(--accent);stroke-width:2.5}
.graph path.e.hi{stroke:var(--ink);stroke-width:2}
.graph path.e.crit.hi{stroke:var(--accent)}
.graph marker path{stroke:none}
.graph .m-line{fill:var(--edge)} .graph .m-met{fill:var(--muted)} .graph .m-crit{fill:var(--accent)} .graph .m-hi{fill:var(--ink)}
.graph.focus .node:not(.hi){opacity:.28}
.graph.focus path.e:not(.hi){opacity:.12}
.graph .node.nomatch{opacity:.25}
.legend i.swatch{display:inline-block;width:18px;height:0;border-radius:0;background:none;border-top:2px solid;vertical-align:4px;margin-right:6px}

/* detail sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10}
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:11;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.08);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet .bar{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px 0 20px;border-bottom:1px solid var(--line-soft)}
.sheet .bar .nav{display:flex;gap:2px;margin-left:auto}
.sheet .bar .nav button,.sheet .bar .x{border:0;background:transparent;color:var(--muted);min-width:32px;height:32px;border-radius:6px;font-size:13px;line-height:1}
.sheet .bar .x{font-size:20px}
.sheet .bar .nav button:hover,.sheet .bar .x:hover{background:var(--sunk)}
.sheet .bar .nav button:disabled{opacity:.4;cursor:default}
.sheet .body{flex:1;overflow-y:auto;padding:18px 20px 12px;display:flex;flex-direction:column;gap:18px}
.sheet h2{font-size:18px;line-height:1.4}
.sheet .bar h2{font-size:15px}
.setform{display:flex;flex-direction:column;gap:14px}
.setform label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.setform input,.setform textarea{width:100%;font-weight:400;color:var(--ink)}
.setform textarea{min-height:110px;font-family:var(--f-mono);font-size:13px}
.setform .hint2{font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.5}
.fields{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:13.5px}
.fields .k{color:var(--muted);font-size:13px;font-weight:600}
.fields select,.fields input{width:100%}
.block{display:flex;flex-direction:column;gap:6px}
.block h3{font-size:13px;color:var(--muted);font-weight:600}
.block .pre{white-space:pre-wrap;overflow-wrap:anywhere}
.deplist{display:flex;flex-wrap:wrap;gap:6px}
.deplist button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:13px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line-soft)}
.msg.agent{background:var(--agent-soft);border-color:transparent}
.msg.new{box-shadow:inset 3px 0 0 var(--accent)}
.msg .h{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.msg .text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.type{font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;line-height:19px;color:var(--text2);background:var(--sunk)}
.type.question{color:var(--warn);background:var(--warn-soft)}
.type.blocker{color:var(--danger);background:var(--danger-soft)}
.type.handoff{color:var(--accent);background:var(--accent-soft)}
.sheet .composer{border-top:1px solid var(--line-soft);padding:12px 20px 16px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--danger);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 14px;font-size:13.5px;max-width:calc(100% - 32px)}

/* code: what a task touches, the open tasks touching the same files, and the code map */
.touches{display:flex;flex-wrap:wrap;gap:6px}
.touch{display:inline-flex;align-items:center;gap:2px;max-width:100%;min-height:24px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);font-family:var(--f-mono);font-size:12px;color:var(--text2)}
.touch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.touch button{flex:none;border:0;background:none;color:var(--muted);width:20px;height:20px;margin-right:-6px;border-radius:4px;padding:0;line-height:1}
.touch button:hover{background:var(--line-soft);color:var(--ink)}
.overlap{font-size:11.5px;font-weight:600;color:var(--warn);white-space:nowrap}
td.what .overlap{margin-left:8px}
.overlaps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.overlaps button{background:none;border:0;padding:0;text-align:left;color:var(--warn);font-size:13px;overflow-wrap:anywhere}
.overlaps button:hover{text-decoration:underline;text-underline-offset:3px}
.code .form-row input{flex:1 1 200px}
.rule .mapsearch{width:100%;margin-top:4px}
.maplines{font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text2)}
.maplines:empty{display:none}

@media (max-width:560px){
  body{font-size:14px;padding-block:20px 56px}
  h1{font-size:24px}
  .box,.lane{padding:16px}
  .toolbar{position:static}
  .feed li,.activity li{grid-template-columns:1fr}
  .feed .at{flex-direction:row;flex-wrap:wrap;align-items:center}
}
@media (prefers-reduced-motion:reduce){.node,.graph path.e{transition:none}.agent-mark.live::before{animation:none}}
</style>

<script>
(function () {
  // ---------- strings: meta/config.lang picks a table; meta/config.strings overrides any key ----------
  var I18N = {
    en: {
      loading: 'Loading…',
      noDb: 'Board data is not available. Reload the page, or open the board where it is hosted.',
      back: '← Projects',
      loadFail: 'Could not load tasks ({e})',
      milestone: 'Milestone',
      tasksCount: '{n} tasks · {d} done',
      lastChange: 'Last change {t}',

    const what = f.k === 'doc' ? 'sections' : 'symbols';
    const lines = [`${f.i} · ${f.k}${c ? ` · community ${c}` : ''} · ${inner.length} ${what} · imported by ${importers.length}`];
    if (inner.length) {
      lines.push(`${what}:`);
      graphList(lines, inner, limit, (id) => { const n = g.nodes.get(id); return `  ${n.n} ${graphKind(n)} ${n.l}${graphSig(n)}`; }, true);
    }
    const groups = [['imports', graphEnds(g, [f.i], 'out', 'imports')], ['imported by', importers],
      ['mentions', graphEnds(g, all, 'out', 'mentions')], ['mentioned in', graphEnds(g, all, 'in', 'mentions')]];
    for (const [label, ends] of groups) {
      if (!ends.length) continue;
      lines.push(`${label}:`);
      graphList(lines, ends, limit, ([id, conf]) => `  ${id} [${conf}]`, true);
    }
    return { lines, id: f.i, symbols: inner };
  }

  // breadth first over the edges keep accepts, either way along each; how each reached node was reached, or null
  function graphWalk(g, from, to, max, keep) {
    const prev = new Map([[from, null]]);
    let frontier = [from];
    for (let d = 0; d < max && frontier.length && !prev.has(to); d++) {
      const next = [];
      for (const id of frontier) {
        const steps = (g.out.get(id) || []).filter(keep).map((e) => [e.to, e])
          .concat((g.in.get(id) || []).filter(keep).map((e) => [e.from, e])).sort((x, y) => graphCmp(x[0], y[0]));
        for (const [n, e] of steps) if (!prev.has(n)) { prev.set(n, [id, e]); next.push(n); }
      }
      frontier = next;
    }
    return prev.has(to) ? prev : null;
  }

  // the shortest chain of edges between two names, whichever way each edge points; through code alone when there is
  // one, since a doc that mentions both says little about how they connect
  function graphPath(g, a, b, { max = 6 } = {}) {
    const A = graphOne(g, a);
    if (!A.id) return A;
    const B = graphOne(g, b);
    if (!B.id) return B;
    const prev = graphWalk(g, A.id, B.id, max, (e) => GRAPH_CODE[e.type]) || graphWalk(g, A.id, B.id, max, () => true);
    if (!prev) return { lines: [`no path from ${A.id} to ${B.id} within ${max} steps`], missing: true };
    const steps = [];
    for (let id = B.id; prev.get(id); id = prev.get(id)[0]) steps.unshift({ at: prev.get(id)[0], to: id, e: prev.get(id)[1] });
    const line = steps.reduce((s, { at, to, e }) => `${s}${e.from === at ? ` --${e.type}--> ` : ` <--${e.type}-- `}${to}`, A.id);
    const guessed = steps.filter((s) => s.e.conf === 'i').map((s) => `${s.e.from} → ${s.e.to}`);
    return { lines: guessed.length ? [line, `matched by name: ${guessed.join(', ')}`] : [line], path: [A.id, ...steps.map((s) => s.to)] };
  }

  // what a word can match on a node: its names (×3), the parts of its path or name (×2), and its text (×1)
  function graphTerms(g) {
    if (g.terms) return g.terms;
    g.terms = new Map();
    for (const id of g.ids) {
      const n = g.nodes.get(id), name = String(n.n || '');
      let names, parts, hay;
      if (n.k === 'file' || n.k === 'doc') {
        names = [name.replace(/\.[^.]+$/, '').toLowerCase()];
        parts = id.toLowerCase().split(/[/._-]+/);
        hay = id.toLowerCase();
      } else if (n.k === 'sym') {
        const last = name.slice(name.lastIndexOf('.') + 1);
        names = [name.toLowerCase(), last.toLowerCase()];
        parts = last.replace(/([a-z0-9])([A-Z])/g, '$1 $2').toLowerCase().split(/[\s_$]+/);
        hay = name.toLowerCase();
      } else {
        names = [name.toLowerCase()];
        parts = name.toLowerCase().split(/[^\p{L}\p{N}_]+/u);
        hay = names[0];
      }
      g.terms.set(id, { names, parts, hay });
    }
    return g.terms;
  }

  // how well a word matches a node: one of its names 3, a part of its path or name 2, somewhere in its text 1
  const graphMatch = (t, w) => (t.names.includes(w) ? 3 : t.parts.includes(w) ? 2 : t.hay.includes(w) ? 1 : 0);

  function graphQuery(g, text, { limit = 20 } = {}) {
    const words = [...new Set(String(text || '').toLowerCase().split(/[^\p{L}\p{N}_]+/u))].filter((w) => w.length >= 3 && !GRAPH_STOP.has(w));
    const terms = graphTerms(g), hits = words.map(() => []);
    for (const id of g.ids) words.forEach((w, k) => { const m = graphMatch(terms.get(id), w); if (m) hits[k].push([id, m]); });
    // A word counts less the more nodes it matches. A common word ('read' is in every reader and every README) cannot
    // carry a node alone when the question has a rarer word: such a node must match one of those.
    const rarest = Math.min(...hits.map((list) => list.length || Infinity));
    const common = hits.map((list) => list.length > GRAPH_COMMON_MIN && list.length >= GRAPH_COMMON_RATIO * rarest);
    const rare = hits.some((list, k) => list.length && !common[k]);
    const score = new Map(), carried = new Set();
    hits.forEach((list, k) => {
      for (const [id, m] of list) {
        score.set(id, (score.get(id) || 0) + m / Math.log(2 + list.length));
        if (!common[k]) carried.add(id);
      }
    });
    for (const id of [...score.keys()]) {
      if (rare && !carried.has(id)) score.delete(id);
      else score.set(id, score.get(id) * Math.log(2 + graphDeg(g, id)));
    }
    if (!score.size) return { lines: [`nothing in the map matches: ${text}`], missing: true };
    const byScore = (a, b) => score.get(b) - score.get(a) || graphCmp(a, b);
    // the best matches bring their neighbors: a matching function brings its file, its callers and what it calls
    for (const seed of [...score.keys()].sort(byScore).slice(0, GRAPH_SEEDS)) {
      const near = score.get(seed) / 4;
      for (const e of (g.out.get(seed) || []).concat(g.in.get(seed) || [])) {
        const other = e.from === seed ? e.to : e.from;
        if ((score.get(other) || 0) < near) score.set(other, near);
      }
    }
    // code first and tests after the code they test; docs apart, a few
    const isCode = (id) => g.nodes.get(id).k === 'file' || g.nodes.get(id).k === 'sym';
    const isTest = (id) => { const f = g.nodes.get(g.nodes.get(id).f); return f && f.q === 't' ? 1 : 0; };
    const code = [...score.keys()].filter(isCode).sort((a, b) => isTest(a) - isTest(b) || byScore(a, b)).slice(0, limit);
    const kinds = { files: code.filter((id) => g.nodes.get(id).k === 'file'), symbols: code.filter((id) => g.nodes.get(id).k === 'sym'),
      docs: [...score.keys()].filter((id) => !isCode(id)).sort(byScore).slice(0, GRAPH_DOC_LINES) };
    const symbolCount = (id) => (g.files.get(id) || []).filter((s) => g.nodes.get(s).k === 'sym').length;
    const show = {
      files: (id) => { const c = graphCommunity(g, g.nodes.get(id)); return `  ${id} · ${symbolCount(id)} symbols${c ? ` · ${c}` : ''}`; },
      symbols: (id) => { const n = g.nodes.get(id); return `  ${id} · ${graphKind(n)} · ${n.l}${graphSig(n)}`; },
      docs: (id) => { const n = g.nodes.get(id); return n.k === 'doc' ? `  ${id} · doc` : `  ${id} · ${graphKind(n)} · ${n.l}`; },
    };
    const lines = [];
    for (const k of ['files', 'symbols', 'docs']) {
      if (!kinds[k].length) continue;
      lines.push(`${k}:`);
      for (const id of kinds[k]) lines.push(show[k](id));
    }
    return { lines, ...kinds };
  }

  // who depends on a node: importers, callers, users and subclasses; for a file, also those of its symbols, from elsewhere
  function graphDependents(g, id) {
    const n = g.nodes.get(id), found = [];
    const targets = n.k === 'file' ? g.files.get(id) || [id] : [id];
    for (const t of targets) for (const e of g.in.get(t) || []) if (GRAPH_DEPENDS[e.type]) found.push(e);
    return n.k === 'file' ? found.filter((e) => g.nodes.get(e.from).f !== id) : found;
  }

  function graphImpact(g, nameOrPath, { depth = 2, limit = 30 } = {}) {
    const hit = graphOne(g, nameOrPath);
    if (!hit.id) return hit;
    // a file's own symbols do not depend on it
    const seen = new Set(g.nodes.get(hit.id).k === 'file' ? g.files.get(hit.id) : [hit.id]), levels = [];
    let frontier = [hit.id];
    for (let d = 1; d <= depth && frontier.length; d++) {

      for (const id of frontier) {
        for (const e of graphDependents(g, id)) if (!seen.has(e.from)) { seen.add(e.from); level.push(e); }
      }
      level.sort((a, b) => graphCmp(a.from, b.from));
      if (level.length) levels.push(level);
      frontier = level.map((e) => e.from);
    }
    const total = levels.reduce((s, l) => s + l.length, 0);
    if (!total) return { lines: [`nothing depends on ${hit.id}`], levels: [] };
    const lines = [`impact of ${hit.id}: ${total} dependents within ${depth} steps`];
    levels.forEach((level, d) => {
      lines.push(`depth ${d + 1}:`);
      graphList(lines, level, limit, (e) => `  ${e.from} [${e.conf}] ${e.type}`, true);
    });
    return { lines, levels: levels.map((l) => l.map((e) => e.from)) };
  }

  function graphOverview(g, { limit = 10 } = {}) {
    const ix = g.index, c = ix.counts || {};

    if (langs.length) lines.push(`langs: ${langs.map(([l, n]) => `${l} ${n}`).join(' · ')}`);
    const communities = ix.communities || [], god = ix.god || [];
    if (communities.length) {

      graphList(lines, communities, limit, (x) => `  ${x.name} · ${x.n} files · ${(x.top || []).slice(0, 3).join(', ')}`);
    }
    if (god.length) {

      graphList(lines, god, limit, (id) => {
        const n = g.nodes.get(id);
        return n ? `  ${id} · ${graphKind(n)} · degree ${graphDeg(g, id)}` : `  ${id}`;

    return { lines, communities, god };
  }

  // the files a task's touches name: a path, a symbol's file, or the one node a bare name means
  function graphTouchFiles(g, touches) {
    const files = new Set();
    for (const t of touches) {

      if (ids.length === 1) files.add(g.nodes.get(ids[0]).f);

  const graphImports = (g, a, b) => (g.out.get(a) || []).some((e) => e.type === 'imports' && e.to === b);

  // Open tasks that touch the same code: the same touch written on both; else, with a map, the same file under
  // different names, or a file of one importing a file of the other.
  function graphOverlaps(g, tasks) {
    const list = (Array.isArray(tasks) ? tasks : []).filter((t) => t && Array.isArray(t.touches) && t.touches.length);
    const who = (t) => (t.holder ? `${t.key} (${t.holder})` : `${t.key}`);
    const lines = [], pairs = [];
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        const shared = [...new Set(a.touches.filter((x) => b.touches.includes(x)))];
        let what = shared, hops = [];
        if (!shared.length) {
          const fa = graphTouchFiles(g, a.touches), fb = graphTouchFiles(g, b.touches);
          what = fa.filter((f) => fb.includes(f));
          if (!what.length) {
            for (const x of fa) for (const y of fb) {
              if (graphImports(g, x, y)) hops.push([x, y]);
              else if (graphImports(g, y, x)) hops.push([y, x]);
            }
          }
        }
        if (!what.length && !hops.length) continue;
        lines.push(`${who(a)} ↔ ${who(b)}: ${what.length ? what.join(', ') : hops.map(([x, y]) => `${x} → ${y}`).join(', ')}`);
        pairs.push({ a: a.key, b: b.key, ...(what.length ? { shared: what } : { imports: hops }) });
      }
    }
    return { lines, pairs };
  }

  // The part of the map a task needs when it is claimed: its touches, the repo paths its text names, and the symbols
  // it names in backticks or CamelCase, each as its file with what that file is.
  function graphContext(g, task, { limit = 8 } = {}) {
    const t = task || {}, found = new Map();
    const add = (file, name) => {
      if (!g.nodes.has(file)) return;
      if (!found.has(file)) found.set(file, new Set());
      if (name) found.get(file).add(name);
    };
    for (const touch of Array.isArray(t.touches) ? t.touches : []) {
      const ids = graphFind(g, touch);
      if (ids.length === 1) { const n = g.nodes.get(ids[0]); add(n.f, n.k === 'sym' ? n.n : ''); }
    }
    const text = [t.title, t.spec, t.acceptance].filter((s) => typeof s === 'string').join('\n');
    for (const m of text.matchAll(/[\w@~.-]+(?:\/[\w@~.-]+)+|[\w@~-][\w@~.-]*\.[A-Za-z0-9]+/g)) {
      const p = m[0].replace(/^\.\//, '').replace(/[.,;:]+$/, '');
      const n = g.nodes.get(p);
      if (n && (n.k === 'file' || n.k === 'doc')) { add(p, ''); continue; }
      const ends = p.includes('/') ? g.ids.filter((id) => { const k = g.nodes.get(id).k; return (k === 'file' || k === 'doc') && id.endsWith(`/${p}`); }) : [];
      if (ends.length === 1) add(ends[0], '');
    }
    const names = new Set();
    for (const m of text.matchAll(/`([^`\n]+)`/g)) names.add(m[1].trim().replace(/\(.*\)$/, ''));
    for (const m of text.matchAll(/\b[A-Za-z_$][\w$]*[a-z0-9][A-Z][\w$]*/g)) names.add(m[0]);
    for (const name of names) {
      const ids = (g.names.get(name.toLowerCase()) || []).filter((id) => g.nodes.get(id).k === 'sym' && g.nodes.get(id).n === name);
      // a name defined in many places says little about where the work is
      if (ids.length && ids.length <= 3) for (const id of ids) add(g.nodes.get(id).f, name);
    }
    const lines = [];
    for (const [file, syms] of [...found].slice(0, limit)) {
      const n = g.nodes.get(file), c = graphCommunity(g, n);
      const count = (g.files.get(file) || []).filter((id) => g.nodes.get(id).k === 'sym').length;
      const importers = graphEnds(g, [file], 'in', 'imports').length;
      lines.push([file, `${count} symbols`, `imported by ${importers}`, c, [...syms].join(', ')].filter(Boolean).join(' · '));
    }
    return { lines, files: [...found.keys()].slice(0, limit) };
  }

  function loadGraph(index, chunks) {
    const g = { index: index || {}, nodes: new Map(), out: new Map(), in: new Map(), names: new Map(), lasts: new Map(),
      files: new Map(), ids: [], degree: new Map(), terms: null };
    const edges = [];
    for (const ch of chunks || []) {
      for (const n of (ch && ch.nodes) || []) if (n && typeof n.i === 'string') g.nodes.set(n.i, n);
      for (const e of (ch && ch.edges) || []) if (Array.isArray(e)) edges.push(e);
    }
    const kept = edges.filter(([from, to]) => g.nodes.has(from) && g.nodes.has(to));
    for (const [from, to, type, conf] of kept) {

      graphPush(g.out, from, e);
      graphPush(g.in, to, e);
    }
    g.degree = mapDegrees(kept);
    g.ids = [...g.nodes.keys()].sort(graphCmp);
    for (const id of g.ids) {
      const n = g.nodes.get(id), name = String(n.n || '');
      graphPush(g.names, name.toLowerCase(), id);
      if (graphShort(n) !== name) graphPush(g.names, graphShort(n).toLowerCase(), id);
      if (n.k === 'sym' && name.includes('.')) graphPush(g.lasts, name.slice(name.lastIndexOf('.') + 1).toLowerCase(), id);
      if (n.f) graphPush(g.files, n.f, id);
    }
    return {
      index: g.index,
      explain: (name, opts) => graphExplain(g, name, opts || {}),
      file: (path, opts) => graphFile(g, path, opts || {}),
      path: (a, b, opts) => graphPath(g, a, b, opts || {}),
      query: (text, opts) => graphQuery(g, text, opts || {}),
      impact: (nameOrPath, opts) => graphImpact(g, nameOrPath, opts || {}),
      overview: (opts) => graphOverview(g, opts || {}),
      overlaps: (tasks) => graphOverlaps(g, tasks),
      context: (task, opts) => graphContext(g, task, opts || {}),

  // numbered sections ("1. Roles") with "- " bullets become cards; lines before the first number are an intro card
  function ruleCards(text) {
    var cards = [],
      cur = { num: '', title: T('rulesIntro'), items: [], paras: [] };
    String(text)
      .split('\n')
      .forEach(function (line) {
        var l = line.trim();
        if (!l) return;
        var m = /^(\d+)\.\s+(.*)$/.exec(l);
        if (m) {
          if (cur.items.length || cur.paras.length) cards.push(cur);
          cur = { num: m[1], title: m[2], items: [], paras: [] };
          return;
        }
        if (/^-\s+/.test(l)) cur.items.push(l.replace(/^-\s+/, ''));
        else cur.paras.push(l);
      });
    if (cur.items.length || cur.paras.length) cards.push(cur);
    return cards.map(function (c) {
      return el('div', { class: 'rule' }, [
        el('h3', {}, [c.num ? el('span', { class: 'num', text: c.num }) : null, c.title]),
        c.paras.length ? el('p', { text: c.paras.join(' ') }) : null,
        c.items.length
          ? el(
              'ul',
              {},
              c.items.map(function (i) {
                return el('li', { text: i });
              })
            )
          : null
      ]);
    });
  }
  // A text document people keep on the page, read as cards: the project rules (meta/rules, which agents receive when they
  // start board work) and the project notes (meta/notes: schedule, where things stand, open questions; agents read them
  // only when they need them). Each subscribes once its section opens; the rules show the older meta/protocol card until saved.
  function textDoc(k, path, legacyPath, tellByDefault) {
    var d = { doc: null, loaded: false, old: null, oldLoaded: !legacyPath, subbed: false, editing: false, draft: null },
      tid = k + 'Text';
    function subscribe() {
      // the flag goes up first: a snapshot may arrive before onSnapshot returns
      if (!db || d.subbed) return;
      d.subbed = true;
      db.doc(path).onSnapshot(
        function (x) {
          d.doc = x.exists ? x.data() : null;
          d.loaded = true;
          render();
        },
        function () {
          d.loaded = true;
          render();
        }
      );
      if (legacyPath)
        db.doc(legacyPath).onSnapshot(
          function (x) {
            d.old = x.exists ? x.data() : null;
            d.oldLoaded = true;
            render();
          },
          function () {
            d.oldLoaded = true;
            render();
          }
        );
    }
    function render() {
      var body = $(k + 'Body'),
        edit = $(k + 'Edit'),
        shut = folded(k);
      if (!shut) subscribe();
      var own = d.doc && typeof d.doc.text === 'string' && d.doc.text.trim() ? d.doc : null,
        legacy = !own && d.old && d.old.text ? d.old : null;
      $(k + 'N').textContent = own
        ? ['rev ' + (own.rev || 1), own.by ? personName(own.by) : '', own.updatedAt ? stamp(own.updatedAt) : '']
            .filter(Boolean)
            .join(' · ')
        : '';
      edit.textContent = own || legacy ? T('edit') : T('write');
      edit.hidden = shut || d.editing || !writable() || !d.loaded;
      if (shut || (d.editing && $(tid))) return;
      body.textContent = '';
      if (!db) {
        body.appendChild(el('p', { class: 'empty', text: failed || T('loading') }));
        return;
      }
      if (d.editing) {
        var ta = el('textarea', { id: tid, 'aria-label': T('h_' + k) });
        ta.value = d.draft != null ? d.draft : (own || legacy || {}).text || '';
        ta.addEventListener('input', function () {
          d.draft = ta.value;
        });
        var tell = el('input', { type: 'checkbox', checked: tellByDefault ? '' : null });
        var ok = el('button', { type: 'button', class: 'btn primary small', text: T('save') });
        ok.addEventListener('click', function () {
          var rev = ((d.doc && d.doc.rev) || 0) + 1,
            at = now();
          ok.disabled = true;
          db.doc(path)
            .set({ text: ta.value.trim(), rev: rev, updatedAt: at, by: me || null })
            .then(function () {
              d.editing = false;
              d.draft = null;
              render();
              if (tell.checked && me)
                return db
                  .doc('notices/n-' + at.replace(/:/g, '-') + '-' + me)
                  .set({ at: at, author: me, kind: 'human', type: 'note', text: T(k + 'Changed', { r: rev }) });
            })
            .catch(function (e) {
              ok.disabled = false;
              toast(T('saveFail', { e: errText(e) }));
              refused(e);
            });
        });
        var cancel = el('button', {
          type: 'button',
          class: 'btn small',
          text: T('cancel'),
          onclick: function () {
            d.editing = false;
            d.draft = null;
            render();
          }
        });
        body.appendChild(
          el('div', { class: 'block' }, [
            warnLine(),
            ta,
            el('div', { class: 'form-row' }, [
              ok,
              cancel,
              me
                ? el(
                    'label',
                    { class: 'muted', style: 'font-size:13px;display:inline-flex;gap:6px;align-items:center' },
                    [tell, T('tellAll')]
                  )
                : null
            ])
          ])
        );
        return;
      }
      if (!own && !legacy) {
        body.appendChild(el('p', { class: 'empty', text: d.loaded && d.oldLoaded ? T(k + 'Empty') : T('loading') }));
        return;
      }
      if (legacy) body.appendChild(el('p', { class: 'rules-note', text: T('rulesLegacy') }));
      body.appendChild(el('div', { class: 'rules' }, ruleCards((own || legacy).text)));
    }
    $(k + 'Edit').addEventListener('click', function () {
      d.editing = true;
      render();
      var a = $(tid);
      if (a) a.focus();
    });
    return render;
  }

  // ---------- code: what tasks touch, where open tasks meet, the code map ----------
  // A touch names a file ('shared/units.ts'), a symbol in one ('server/flow.js#start') or only a symbol's name
  // ('BoardError'), which says no file. Open tasks meet where they touch the same file.
  function touchesOf(t) {
    return (Array.isArray(t.touches) ? t.touches : []).filter(function (touch) {
      return typeof touch === 'string' && !!touch;
    });
  }
  function touchedFile(touch) {
    var file = touch.split('#')[0];
    return /[\/.]/.test(file) ? file : null;
  }
  // which open tasks share a touched file, worked out once per snapshot: a card or a row only looks its task up
  var overlapsById = Object.create(null);
  function findOverlaps() {
    var byFile = Object.create(null),
      found = Object.create(null);
    tasks.forEach(function (t) {
      if (knownStatus(t) === 'done') return;
      touchesOf(t).forEach(function (touch) {
        var file = touchedFile(touch),
          list = file ? (byFile[file] = byFile[file] || []) : null;
        if (list && list.indexOf(t) < 0) list.push(t);
      });
    });
    Object.keys(byFile)
      .sort()
      .forEach(function (file) {
        byFile[file].forEach(function (t) {
          byFile[file].forEach(function (other) {
            if (other === t) return;
            var mine = (found[t.id] = found[t.id] || Object.create(null));
            (mine[other.id] = mine[other.id] || { task: other, what: [] }).what.push(file);
          });
        });
      });
    overlapsById = found;
  }
  function overlapsOf(t) {
    var mine = overlapsById[t.id];
    return mine
      ? Object.keys(mine)
          .map(function (id) {
            return mine[id];
          })
          .sort(function (a, b) {
            return byKey(a.task, b.task);
          })
      : [];
  }
  function overlapText(overlap) {
    return T('overlapsWith', {
      k: overlap.task.key,
      p: personName(holderOf(overlap.task)),
      w: overlap.what.join(', ')
    });
  }
  function overlapFlag(t) {
    var list = overlapsOf(t);
    return list.length
      ? el('span', { class: 'overlap', title: list.map(overlapText).join('\n'), text: T('overlapFlag') })
      : null;
  }
  function taskTouches(t) {
    return { key: t.key, holder: holderOf(t), touches: touchesOf(t) };
  }
  // the sheet's overlaps: shared files, and once a search has loaded a map's chunks, files one import apart
  function sheetOverlaps(t) {
    var list = overlapsOf(t),
      graphs = Object.keys(mapCards)
        .map(function (key) {
          return mapCards[key].graph;
        })
        .filter(Boolean);
    if (!graphs.length || knownStatus(t) === 'done' || !touchesOf(t).length) return list;
    tasks.forEach(function (other) {
      var shared = list.some(function (overlap) {
        return overlap.task === other;
      });
      if (other === t || shared || knownStatus(other) === 'done' || !touchesOf(other).length) return;
      var what = [];
      graphs.forEach(function (graph) {
        graph.overlaps([taskTouches(t), taskTouches(other)]).lines.forEach(function (line) {
          // a line reads 'M1-4 (ana) ↔ M1-6 (ben): a.js → b.js'; the sheet says the task and its holder itself
          var at = line.lastIndexOf(': ');
          what.push(at < 0 ? line : line.slice(at + 2));
        });
      });
      if (what.length) list.push({ task: other, what: what });
    });
    return list;
  }
  // The sheet's Code block: what the work touches (agents name files as they go, people add them here) and the open
  // tasks touching the same code. It shows once a task names code or the project has a map to name it against.
  function codeBlock(t, values) {
    var mine = touchesOf(t),
      editable = writable() && !!me;
    if (!mine.length && !(maps && maps.length)) return null;
    var overlaps = sheetOverlaps(t);
    var input = el('input', {
      type: 'text',
      id: 'fTouch',
      spellcheck: 'false',
      placeholder: T('touchPh'),
      'aria-label': T('touchPh')
    });
    input.value = values.fTouch || '';
    // the box empties at once: the write redraws the sheet, which would bring the draft back
    function add() {
      var fresh = input.value.split(/[\s,]+/).filter(function (touch, i, all) {
        return touch && all.indexOf(touch) === i && mine.indexOf(touch) < 0;
      });
      input.value = '';
      if (fresh.length)
        change(t, function (current) {
          var had = touchesOf(current);
          return {
            touches: had.concat(
              fresh.filter(function (touch) {
                return had.indexOf(touch) < 0;
              })
            )
          };
        });
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        add();
      }
    });
    function chip(touch) {
      return el('span', { class: 'touch', title: touch }, [
        el('span', { text: touch }),
        editable
          ? el('button', {
              type: 'button',
              'aria-label': T('removeTouch', { x: touch }),
              title: T('removeTouch', { x: touch }),
              text: '×',
              onclick: function () {
                change(t, function (current) {
                  var left = touchesOf(current).filter(function (other) {
                    return other !== touch;
                  });
                  return { touches: left.length ? left : null };
                });
              }
            })
          : null
      ]);
    }
    return el('div', { class: 'block code' }, [
      el('h3', { text: T('touches') }),
      mine.length
        ? el('div', { class: 'touches' }, mine.map(chip))
        : el('p', { class: 'muted', style: 'font-size:13.5px', text: T('touchesNone') }),
      overlaps.length
        ? el(
            'ul',
            { class: 'overlaps' },
            overlaps.map(function (overlap) {
              return el('li', {}, [
                el('button', {
                  type: 'button',
                  text: overlapText(overlap),
                  onclick: function () {
                    openSheet(overlap.task.id);
                  }
                })
              ]);
            })
          )
        : null,
      editable

  function lineage(id) {
    var g = document.querySelector('.graph');
    if (!g || !graphRel) return;
    var line = id ? graphRel.lineOf(id) : null;
    if (!line) {
      g.classList.remove('focus');
      g.querySelectorAll('.hi').forEach(function (n) {
        n.classList.remove('hi');
      });
      g.querySelectorAll('path.e').forEach(function (p) {
        var b = p.classList.contains('crit') ? 'crit' : p.classList.contains('met') ? 'met' : 'line';
        p.setAttribute('marker-end', 'url(#m-' + b + ')');
      });
      return;
    }
    var keep = {};
    keep[id] = 1;
    for (var a in line.anc) keep[a] = 1;
    for (var d in line.desc) keep[d] = 1;
    g.classList.add('focus');
    g.querySelectorAll('.node').forEach(function (n) {
      n.classList.toggle('hi', !!keep[n.dataset.k]);
    });
    g.querySelectorAll('path.e').forEach(function (p) {
      var on = keep[p.getAttribute('data-from')] && keep[p.getAttribute('data-to')];
      p.classList.toggle('hi', !!on);
      var base = p.classList.contains('crit') ? 'crit' : p.classList.contains('met') ? 'met' : 'line';
      p.setAttribute('marker-end', 'url(#m-' + (on && base !== 'crit' ? 'hi' : base) + ')');
    });
  }

  function applyCursor(scroll) {

      n.classList.remove('cursor');
    });
    if (!cursor) return;
    var n = document.querySelector('.view:not([hidden]) [data-k="' + cursor + '"]');
    if (!n) return;
    n.classList.add('cursor');
    if (scroll)
      try {
        n.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      } catch (e) {}
    if (view === 'graph') lineage(cursor);
  }
  function moveCursor(step) {
    if (!order.length) return;
    var i = order.indexOf(cursor);
    i = i < 0 ? (step > 0 ? 0 : order.length - 1) : Math.max(0, Math.min(order.length - 1, i + step));
    cursor = order[i];
    applyCursor(true);
    if (openId) openSheet(cursor);
  }
  document.addEventListener('keydown', function (e) {

        return;
      }

        close();
        return;
      }
      if (cursor) {
        cursor = null;
        applyCursor();
        lineage(null);
      }
      return;
    }
    if (settingsOpen) return;
    var t = e.target,
      tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') {
      e.preventDefault();
      if (openId) close();
      searchInput.focus();
      searchInput.select();
      return;
    }
    if (e.key === 'j') {
      e.preventDefault();
      moveCursor(1);
      return;
    }
    if (e.key === 'k') {
      e.preventDefault();
      moveCursor(-1);
      return;
    }
    if (e.key === 'Enter' && cursor && !openId && tag !== 'BUTTON' && tag !== 'A') {
      e.preventDefault();

    if (!openId && (e.key === '1' || e.key === '2' || e.key === '3')) {

      })
      .sort(byKey);
    return [
      el('div', { class: 'block' }, [
        el('h3', { text: T('depsBlock') }),
        deps.length ? depButtons(deps.map(taskByKey).filter(Boolean)) : el('p', { class: 'muted', text: T('depsNone') })
      ]),
      unlocks.length ? el('div', { class: 'block' }, [el('h3', { text: T('unlockBlock') }), depButtons(unlocks)]) : null
    ];
  }
  function claimLine(t) {
    if (!t.claimedBy) return null;
    return el('p', { class: 'muted', style: 'font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center' }, [
      T('claimedBy'),
      personChip(t.claimedBy.who),
      t.claimedBy.agent ? el('span', { class: 'agent-mark', text: T('agent') }) : null,
      t.claimedBy.session ? el('span', { class: 'key', text: t.claimedBy.session }) : null,
      t.claimedBy.at ? stamp(t.claimedBy.at) : ''
    ]);
  }
  // the open task's thread; a message after the viewer's last look is marked new, their own excepted
  function threadList() {
    var list = el('div', { class: 'msgs' });
    if (msgErr) list.appendChild(el('p', { class: 'err', text: T('threadFail') }));
    else if (!msgs.length) list.appendChild(el('p', { class: 'empty', text: T('threadEmpty') }));
    msgs.forEach(function (m) {
      var ag = m.kind === 'agent',
        nw = !!m.at && m.at > openPrevSeen && !(m.author === me && !ag);
      list.appendChild(
        el('div', { class: 'msg' + (ag ? ' agent' : '') + (nw ? ' new' : '') }, [
          el('div', { class: 'h' }, [
            personChip(m.author),
            ag ? el('span', { class: 'agent-mark', text: T('agent') }) : null,
            el('span', {
              class: 'type ' + (m.type || 'note'),
              text: T('ty_' + (TYPES.indexOf(m.type) >= 0 ? m.type : 'note'))
            }),
            el('span', { text: stamp(m.at) }),
            nw ? el('span', { style: 'color:var(--accent);font-weight:600', text: T('newMsg') }) : null
          ]),
          el('div', { class: 'text', text: m.text || '' })
        ])
      );
    });
    return list;
  }
  // write a message as the viewer (⌘/Ctrl+Enter posts); none for a viewer who cannot write
  function composerBlock(t, values) {
    if (!writable() || !me) return null;
    var ta = el('textarea', { id: 'msgText', 'aria-label': T('post'), placeholder: T('msgPh', { p: personName(me) }) });
    ta.value = values.msgText || '';
    var ty = el('select', { id: 'msgType', 'aria-label': 'type' });
    TYPES.forEach(function (x) {
      ty.appendChild(el('option', { value: x, text: T('ty_' + x) }));
    });
    ty.value = values.msgType || 'note';
    var send = el('button', { type: 'button', class: 'btn primary', text: T('post') });
    send.addEventListener('click', function () {
      var v = ta.value.trim();
      if (!v) return;
      send.disabled = true;
      var at = now();
      markSeen(t.id, at);
      db.doc('tasks/' + t.id + '/messages/' + at.replace(/:/g, '-') + '-' + me)
        .set({ at: at, author: me, kind: 'human', type: ty.value, text: v })
        .then(function () {
          ta.value = '';
          return db.doc('tasks/' + t.id).update({ lastMessageAt: at, lastMessageBy: me, updatedAt: at });
        })
        .catch(function (e) {
          toast(T('postFail', { e: errText(e) }));
          refused(e);
        })
        .then(function () {
          send.disabled = false;
        });
    });
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        send.click();
      }
    });
    return el('div', { class: 'composer' }, [
      warnLine(),
      ta,
      el('div', { class: 'form-row' }, [
        ty,
        send,
        el('span', { class: 'muted', style: 'font-size:12px', text: T('sendHint') })
      ])
    ]);
  }
  function sheetNav(t) {
    var idx = order.indexOf(t.id);
    return el('div', { class: 'nav' }, [
      el('button', {
        type: 'button',
        'aria-label': T('prev'),
        title: T('prev') + ' (k)',
        text: '↑',
        disabled: idx > 0 ? null : '',
        onclick: function () {
          moveCursor(-1);
        }
      }),
      el('button', {
        type: 'button',
        'aria-label': T('next'),
        title: T('next') + ' (j)',
        text: '↓',
        disabled: idx >= 0 && idx < order.length - 1 ? null : '',
        onclick: function () {
          moveCursor(1);
        }
      })
    ]);
  }
  // a re-render replaces the field under the typist, so focus and the caret go back where they were
  function refocus(activeId) {
    var a = activeId && $(activeId);
    if (!a) return;
    a.focus();
    if (a.setSelectionRange && ['msgText', 'fBranch', 'fPr', 'fTouch'].indexOf(activeId) >= 0) {
      try {
        a.setSelectionRange(a.value.length, a.value.length);
      } catch (e) {}
    }
  }
  function renderSheet(fresh) {
    var root = $('sheetRoot');
    var t = openId ? taskById(openId) : null;
    if (!t) {
      root.textContent = '';
      return;
    }
    var kept = sheetState(root);
    root.textContent = '';
    var fields = sheetFields(t, kept);
    var spec = (detailsDoc && detailsDoc.spec) || t.spec || '',
      acc = (detailsDoc && detailsDoc.acceptance) || t.acceptance || '';
    var body = el(
      'div',
      { class: 'body' },
      [
        sheetHead(t),
        fieldGrid(t, fields),
        claimLine(t),
        prLinks(t).length ? el('div', { class: 'form-row' }, prEls(t)) : null,
        summaryBlock(t, kept.values),
        acc
          ? el('div', { class: 'block' }, [el('h3', { text: T('acceptance') }), el('div', { class: 'pre', text: acc })])
          : null,
        spec
          ? el('div', { class: 'block' }, [el('h3', { text: T('spec') }), el('div', { class: 'pre', text: spec })])
          : null,
        codeBlock(t, kept.values)
      ].concat(depBlocks(t), [
        el('div', { class: 'block' }, [el('h3', { text: T('thread', { n: msgs.length }) }), threadList()])
      ])
    );
    var sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'sheetTitle' }, [
      el('div', { class: 'bar' }, [
        el('span', { class: 'key', text: t.key }),
        sheetNav(t),
        el('button', { type: 'button', class: 'x', 'aria-label': T('close'), text: '×', onclick: close })
      ]),
      body,
      composerBlock(t, kept.values)
    ]);
    root.appendChild(el('div', { class: 'scrim', onclick: close }));
    root.appendChild(sheet);
    // a fresh sheet starts at the top; a re-render stays where the reader was, or at the bottom if they were following the thread
    body.scrollTop = fresh ? 0 : kept.atBottom ? body.scrollHeight : kept.scroll;
    if (fresh) sheet.querySelector('.x').focus();
    else refocus(kept.activeId);
  }

  // waitingOn (unfinished deps) lets an agent find pickable work with one query: status == todo, waitingOn == [].
  // While the board is open the page repairs any drift itself. It touches only waitingOn, not updatedAt, so it raises no "new" marker.
  // Every open board sees the same drift, so each waits a random moment and re-checks the latest snapshot:
  // usually one board fixes it and the rest find nothing to do. A view-only viewer never tries; one the platform said nothing about stops after the first refusal.
  var healing = {},
    healTimer = null,
    healOff = false;
  function healWaiting() {
    if (!writable() || healOff || healTimer) return;
    healTimer = setTimeout(
      function () {
        healTimer = null;
        if (!writable()) return;
        tasks.forEach(function (t) {
          var exp = unmet(t),
            cur = Array.isArray(t.waitingOn) ? t.waitingOn : null;
          if (
            cur &&
            cur.length === exp.length &&
            cur.every(function (k, i) {
              return k === exp[i];
            })
          )
            return;
          var sig = t.id + ':' + exp.join(',');
          if (healing[sig] || healOff) return;
          healing[sig] = 1;
          db.doc('tasks/' + t.id)
            .update({ waitingOn: exp })
            .catch(function (e) {
              if (e && e.code === 'invalid_argument') healOff = true;
            });
        });
      },
      500 + Math.random() * 2500
    );
  }

  function renderAll() {
    renderHead();
    renderToolbar();
    renderView();
    if (openId) renderSheet();
  }

  function start() {
    renderAll();
    claude
      .use('user')
      .then(function (u) {
        if (!u) return;
        return Promise.all([u.id(), u.can('data.write')]).then(function (r) {
          uid = r[0] || null;
          canWrite = r[1];
          identify();
          renderAll();
        });
      })
      .catch(function () {});
    claude.use('db').then(function (d) {
      db = d;
      if (!db) {
        failed = T('noDb');
        renderAll();
        return;
      }
      var first = true;
      db.doc('meta/config').onSnapshot(
        function (s) {
          applyConfig(s.exists ? s.data() : {});
          renderAll();
        },
        function () {}
      );
      // a burst of changes (an agent's batch) is drawn once per frame, from the latest snapshot
      var lastTasks = null,
        taskFrame = 0,
        frame =
          window.requestAnimationFrame ||
          function (f) {
            return setTimeout(f, 16);
          };
      db.collection('tasks').onSnapshot(
        function (s) {
          lastTasks = s;
          if (!taskFrame) taskFrame = frame(onTasks);
        },
        function (e) {
          failed = T('loadFail', { e: errText(e) });
          renderAll();
        }
      );
      function onTasks() {
        taskFrame = 0;
        var s = lastTasks;
        // archived tasks (done, moved off the board) stay known for dependencies but leave every list but the archive
        allTasks = s.docs.map(function (x) {
          var o = Object.assign({}, x.data());
          o.id = x.id;
          return o;
        });
        tasks = allTasks.filter(function (t) {
          return !t.archivedAt;
        });
        archived = allTasks.filter(function (t) {
          return !!t.archivedAt;
        });
        indexTasks();
        findOverlaps();
        loaded = true;
        if (first) {
          first = false;
          // a browser opening the board for the first time treats the current state as seen; only later changes count as new
          if (!read('ab-seen-init')) {
            tasks.forEach(function (t) {
              markSeen(t.id, lastTouch(t));
            });
            write('ab-seen-init', '1');
          }
        }
        if (openId) {
          var cur = taskById(openId);
          if (!cur) close();
          else markSeen(openId, lastTouch(cur));
        }
        renderAll();
        healWaiting();
        if (!openId && location.hash.length > 1) {
          var h = decodeURIComponent(location.hash.slice(1));
          if (VIEWS.indexOf(h) >= 0) {
            setView(h);
            try {
              history.replaceState(null, '', location.pathname + location.search);
            } catch (e) {}
          } else {
            var t = taskByKey(h);
            if (t) openSheet(t.id);
          }
        }
      }
      db.collection('notices')
        .orderBy('at', 'desc')
        .limit(30)
        .onSnapshot(
          function (s) {
            notices = s.docs.map(function (x) {
              return x.data();
            });
            if (!noticesLoaded) {
              noticesLoaded = true;
              if (!read('ab-notice-init')) {
                readNotices();
                write('ab-notice-init', '1');
              }
            }
            renderHead();
            renderToolbar();
            if (view === 'doc' && !folded('notices')) renderFeed();
          },
          function () {}
        );
      db.collection('people').onSnapshot(
        function (s) {
          links = {};
          s.docs.forEach(function (x) {
            var o = x.data();
            if (o && typeof o.uid === 'string') links[x.id] = o.uid;
          });
          identify();
          renderAll();
        },
        function () {}
      );
      if (db.onStatus)
        db.onStatus(function (on) {
          live = on;
          renderHead();
        });
      renderNotes();
      renderRules();
    });
  }
  window.addEventListener('hashchange', function () {
    var h = decodeURIComponent(location.hash.slice(1));
    if (!h) {
      if (openId) close();
      return;
    }
    if (VIEWS.indexOf(h) >= 0) {
      setView(h);
      return;
    }
    var t = taskByKey(h);
    if (t && openId !== t.id) openSheet(t.id);
  });
  applyConfig({});
  if (window.claude && window.claude.use) start();
  else {
    failed = T('noDb');
    renderAll();
  }
  setInterval(function () {
    if (loaded && !document.hidden) {
      renderHead();
      if (view === 'doc') {
        renderActivity();
        if (
          !folded('items') &&
          !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#feed'))
        ) {
          renderTable();
          applyCursor();
        }
      }
    }
  }, 60000);
})();
</script>
