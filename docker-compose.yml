# A board on your own domain: point a DNS record at this machine, set BOARD_URL, then `docker compose up -d`.
# Caddy gets the TLS certificate. Admin commands: docker compose exec board node server/cli.js member list
services:
  board:
    build: .
    restart: unless-stopped
    environment:
      BOARD_URL: https://board.example.com
      ARTIBOARD_SITE: Our boards
      ARTIBOARD_LANG: en
    volumes:
      - board-data:/data
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    command: caddy reverse-proxy --from board.example.com --to board:4100
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
volumes:
  board-data:
  caddy-data:
