<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<script>/* the theme a viewer picked on a board page holds across the site */try{var t=localStorage.getItem('ab-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The project list: one card per board, drawn from /api/projects. Admins also manage members here, and
   everyone keeps their own profile. Same tokens as the board page. */
:root{
  --bg:#FAF9F7; --surface:#FFFFFF; --sunk:#F3F2EE; --ink:#1A1A18; --text2:#4F4D48; --muted:#75726B;
  --line:#E2DFD9; --line-soft:#EDEBE6; --edge:#D3CFC8; --scrim:rgba(26,26,24,.28);
  --accent:#2B6BEF; --on-accent:#FFFFFF; --accent-soft:#EAF0FD;
  --warn:#9A5F0E; --warn-soft:#F8EEDC; --danger:#C23B3B; --danger-soft:#FBE9E7;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181715; --surface:#201F1C; --sunk:#1C1B19; --ink:#ECEAE4; --text2:#B9B6AE; --muted:#8F8C85;
  --line:#34322D; --line-soft:#2A2925; --edge:#45423C; --scrim:rgba(0,0,0,.5);
  --accent:#5B93FF; --on-accent:#0E1420; --accent-soft:#1B2438;
  --warn:#E3A853; --warn-soft:#33270F; --danger:#F07272; --danger-soft:#3A1D1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181715; --surface:#201F1C; --sunk:#1C1B19; --ink:#ECEAE4; --text2:#B9B6AE; --muted:#8F8C85;
  --line:#34322D; --line-soft:#2A2925; --edge:#45423C; --scrim:rgba(0,0,0,.5);
  --accent:#5B93FF; --on-accent:#0E1420; --accent-soft:#1B2438;
  --warn:#E3A853; --warn-soft:#33270F; --danger:#F07272; --danger-soft:#3A1D1D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;
  padding:28px max(16px,env(safe-area-inset-left,0px)) 72px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
h2{font-size:19px;font-weight:700;margin:0}
h3{font-size:14.5px;font-weight:700;margin:0}
p{margin:0}
section{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sec-head p{color:var(--muted);font-size:13.5px}
.me{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:14px;align-items:baseline}
.me .who{background:none;border:0;padding:0;color:var(--ink);font-weight:600;font-size:13px}
.me .who:hover{text-decoration:underline;text-underline-offset:3px}
.me .who span{color:var(--muted);font-weight:400}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color:inherit;text-decoration:none;min-width:0}
.card:hover{border-color:var(--edge)}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card strong{font-size:17px}
.card .id{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card .sub{color:var(--text2);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .nums{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.card .repos{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--f-mono);font-size:12px;color:var(--text2)}
.progress{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line-soft)}
.progress span{display:block;height:100%}
.empty{color:var(--muted)}
.err{color:var(--danger);font-size:13px}
.ok{color:var(--muted);font-size:13px}
form.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end}
form.row.members{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(120px,auto) auto}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:36px;min-width:0;font-weight:400;color:var(--ink)}
select{padding-block:0}
.btn{min-height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{border-color:transparent;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent);filter:brightness(1.06)}
.btn.small{min-height:28px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
form .hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:0}
form .err{grid-column:1/-1}

/* members */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:middle;padding:10px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
thead th{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.person{font-family:var(--f-mono);font-size:13px}
td.name{font-weight:600;min-width:120px}
td.name .title{display:block;font-weight:400;font-size:12.5px;color:var(--muted);white-space:normal}
td.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
td.actions select{min-height:28px;padding:0 8px;font-size:12.5px}
.tag{font-size:12px;font-weight:600;border-radius:4px;padding:0 7px;line-height:20px;color:var(--text2);background:var(--sunk)}
.tag.admin{color:var(--accent);background:var(--accent-soft)}
.tag.viewer{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.tag.me{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.reveal{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.reveal .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.reveal .head h3{font-size:15px}
.reveal .head .x{margin-left:auto}
.reveal .once{font-size:13px;color:var(--warn)}
.reveal .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.reveal code,.reveal pre{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;margin:0;overflow-x:auto;white-space:pre}
.reveal .k{font-size:12.5px;font-weight:600;color:var(--muted)}
.reveal .step{display:flex;flex-direction:column;gap:6px}

/* profile dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;width:min(440px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 48px rgba(0,0,0,.12)}
.dialog h2{font-size:18px}
.dialog .fields{display:flex;flex-direction:column;gap:10px}
.dialog .fixed{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.dialog .fixed b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.dialog .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dialog .hint{font-size:12.5px;color:var(--muted);line-height:1.5}
@media (max-width:640px){form.row,form.row.members{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="hSite"></h1>
    <span class="me"><button type="button" class="who" id="meBtn" hidden></button><button type="button" class="linkbtn" id="signOut" hidden></button></span>
  </header>
  <section>
    <div class="sec-head"><h2 id="hBoards"></h2></div>
    <div class="grid" id="list"></div>
  </section>
  <section id="newSec" hidden>
    <div class="sec-head"><h2 id="hNew"></h2></div>
    <form class="row" id="newForm">
      <label><span id="lTitle"></span><input id="nTitle" required maxlength="120"></label>
      <label><span id="lId"></span><input id="nId" required maxlength="40" pattern="[a-z0-9][a-z0-9\-]{0,39}"></label>
      <button type="submit" class="btn primary" id="nGo"></button>
      <p class="hint" id="nHint"></p>
      <p class="err" id="nErr" hidden></p>
    </form>
  </section>
  <section id="memSec" hidden>
    <div class="sec-head"><h2 id="hMembers"></h2><p id="memSub"></p></div>
    <div class="reveal" id="reveal" hidden></div>
    <div class="scroll"><table><thead><tr id="memHead"></tr></thead><tbody id="memRows"></tbody></table></div>
    <form class="row members" id="memForm">
      <label><span id="lPerson"></span><input id="mPerson" required maxlength="32" pattern="[a-z0-9][a-z0-9_\-]{0,31}" autocomplete="off"></label>
      <label><span id="lName"></span><input id="mName" maxlength="60" autocomplete="off"></label>
      <label><span id="lAccess"></span><select id="mAccess"><option value="member"></option><option value="admin"></option><option value="viewer"></option></select></label>
      <button type="submit" class="btn primary" id="mGo"></button>
      <p class="hint" id="mHint"></p>
      <p class="err" id="mErr" hidden></p>
    </form>
  </section>
</div>
<div id="dialogRoot"></div>
<script src="/shim.js"></script>
<script>
(function(){
  var I18N={
    en:{boards:'Boards',loading:'Loading…',loadFail:'Could not load the projects ({e})',none:'No projects yet. Make one below.',signOut:'Sign out',
      new:'New project',title:'Name',titlePh:'e.g. Checkout redesign',id:'Address (lowercase letters, digits, -)',idPh:'e.g. checkout',create:'Create',
      hint:'Creates a board at {u} with every member on it. Agents can also create one with the MCP tool board_create_project.',
      tasks:'{n} tasks',done:'done {n}',last:'last change {t}',now:'just now',m:'{n}m ago',h:'{n}h ago',d:'{n}d ago',never:'never',
      st:{todo:'to do',doing:'doing',review:'review',blocked:'blocked',done:'done'},
      members:'Members',memSub:'Everyone on this site, with a seat on every board. A new member gets one token, shown once: send it to them privately. They sign in to the site with it, or ask their agent for a sign-in link.',
      th:['Person','Name','Access','Tokens','Last used',''],ac:{admin:'admin',member:'member',viewer:'viewer'},meTag:'you',
      person:'Person id (lowercase letters, digits, -, _)',personPh:'e.g. ana',name:'Display name',namePh:'e.g. Ana',access:'Access',add:'Add member',
      memHint:'The id goes into document ids and never changes; the person can set their own name and role later from their profile. Viewers read every board but sit on none.',
      newToken:'New token',link:'Sign-in link',revoke:'Revoke',remove:'Remove',confirmRevoke:'Revoke every token of {p} and sign them out everywhere?',confirmRemove:'Remove {p} from the site? Their tasks and messages stay.',
      added:'{p} is on the site',tokenFor:'Token for {p}',linkFor:'Sign-in link for {p}',once:'Shown once. Send it privately; it is not stored anywhere readable.',
      tokenK:'Token',linkK:'One-time link (one hour, one use)',claudeK:'Claude Code',codexK:'Codex (the token stays in the shell environment)',browserK:'Browser: open {u} and paste the token, or open the link.',copy:'Copy',copied:'Copied',close:'Close',
      profile:'Profile',pName:'Display name',pTitle:'What you do (shown on every board)',pTitlePh:'e.g. backend, design',save:'Save',cancel:'Cancel',saved:'Saved.',
      pHint:'Your name and role show on every board you sit on. The person id and the access level are set by site admins.',pFixed:'Person {p} · {a}',
      fail:'Could not do that ({e})'},
    ko:{boards:'작업판',loading:'불러오는 중이에요.',loadFail:'불러오지 못했어요 ({e})',none:'아직 프로젝트가 없어요. 아래에서 만드세요.',signOut:'로그아웃',
      new:'새 프로젝트',title:'이름',titlePh:'예: 결제 화면 개편',id:'주소 (영문 소문자 · 숫자 · -)',idPh:'예: checkout',create:'만들기',
      hint:'만들면 {u} 에 판이 생기고, 멤버 모두가 사람 목록에 들어가요. 에이전트는 MCP 도구 board_create_project로도 만들 수 있어요.',
      tasks:'태스크 {n}',done:'완료 {n}',last:'마지막 변화 {t}',now:'방금',m:'{n}분 전',h:'{n}시간 전',d:'{n}일 전',never:'없음',
      st:{todo:'할 일',doing:'진행 중',review:'검토',blocked:'막힘',done:'완료'},
      members:'멤버',memSub:'이 사이트의 모든 사람이에요. 모든 판에 자리가 생겨요. 새 멤버는 토큰 하나를 받고, 토큰은 한 번만 보여요. 본인에게 따로 전해 주세요. 그 토큰으로 사이트에 로그인하거나, 에이전트에게 로그인 링크를 받아요.',
      th:['아이디','이름','권한','토큰','마지막 사용',''],ac:{admin:'관리자',member:'멤버',viewer:'보기 전용'},meTag:'나',
      person:'아이디 (영문 소문자 · 숫자 · - · _)',personPh:'예: ana',name:'표시 이름',namePh:'예: 안나',access:'권한',add:'멤버 추가',
      memHint:'아이디는 문서 id에 들어가서 바뀌지 않아요. 이름과 역할은 본인이 프로필에서 바꿀 수 있어요. 보기 전용은 모든 판을 읽지만 사람 목록에는 들어가지 않아요.',
      newToken:'새 토큰',link:'로그인 링크',revoke:'토큰 회수',remove:'삭제',confirmRevoke:'{p}의 토큰을 모두 회수하고 모든 곳에서 로그아웃할까요?',confirmRemove:'{p}을(를) 사이트에서 뺄까요? 태스크와 메시지는 남아요.',
      added:'{p}이(가) 사이트에 들어왔어요',tokenFor:'{p}의 토큰',linkFor:'{p}의 로그인 링크',once:'한 번만 보여요. 본인에게 따로 전해 주세요. 어디에도 읽을 수 있는 형태로 남지 않아요.',
      tokenK:'토큰',linkK:'일회용 링크 (한 시간, 한 번)',claudeK:'Claude Code',codexK:'Codex (토큰은 셸 환경 변수에 둬요)',browserK:'브라우저: {u} 을 열고 토큰을 붙여 넣거나, 링크를 열어요.',copy:'복사',copied:'복사했어요',close:'닫기',
      profile:'프로필',pName:'표시 이름',pTitle:'하는 일 (모든 판에 보여요)',pTitlePh:'예: 백엔드, 디자인',save:'저장',cancel:'취소',saved:'저장했어요.',
      pHint:'이름과 역할은 내가 있는 모든 판의 사람 목록에 보여요. 아이디와 권한은 사이트 관리자가 정해요.',pFixed:'아이디 {p} · {a}',
      fail:'하지 못했어요 ({e})'}
  };
  var L=I18N.en;
  function T(k,v){return String(L[k]).replace(/\{(\w+)\}/g,function(_,x){return v&&v[x]!=null?v[x]:''})}
  var BAR={done:'var(--ink)',review:'var(--muted)',doing:'var(--warn)',blocked:'var(--danger)',todo:'var(--line)'};
  function $(id){return document.getElementById(id)}
  function el(tag,a,kids){var n=document.createElement(tag);for(var k in a||{}){if(a[k]==null)continue;if(k==='text')n.textContent=a[k];else if(k==='class')n.className=a[k];else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),a[k]);else n.setAttribute(k,a[k])}(kids||[]).forEach(function(c){if(c!=null&&c!==false)n.appendChild(typeof c==='string'?document.createTextNode(c):c)});return n}
  // owner/name of each GitHub repository the project lists (meta/config.repos)
  function repos(p){return (Array.isArray(p.repos)?p.repos:[]).map(function(r){return typeof r==='string'?r:r&&r.repo}).filter(function(r){return typeof r==='string'&&/^[\w.-]+\/[\w.-]+$/.test(r)})}
  function ago(iso){var d=new Date(iso);if(!iso||isNaN(d))return '';var s=(Date.now()-d)/1000;if(s<60)return T('now');if(s<3600)return T('m',{n:Math.floor(s/60)});if(s<86400)return T('h',{n:Math.floor(s/3600)});return T('d',{n:Math.floor(s/86400)})}
  function errOf(b){return (b&&(b.message||b.error))||'error'}
  function copyBtn(text){var b=el('button',{type:'button',class:'btn small',text:T('copy')});b.addEventListener('click',function(){
    var done=function(){b.textContent=T('copied');setTimeout(function(){b.textContent=T('copy')},1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,function(){prompt('',text)});else prompt('',text)});return b}

  window.abSession.then(function(s){
    L=I18N[s.config.lang]||I18N.en;document.documentElement.lang=s.config.lang||'en';
    var me=s.me;
    function call(method,url,body){return s.api(method,url,body).then(function(r){return r.json().catch(function(){return {}}).then(function(b){if(!r.ok){var e=new Error(errOf(b));e.code=b.code||b.error;throw e}return b})})}
    document.title=s.config.site;$('hSite').textContent=s.config.site;$('hBoards').textContent=T('boards');$('hNew').textContent=T('new');
    $('lTitle').textContent=T('title');$('lId').textContent=T('id');$('nGo').textContent=T('create');
    $('nTitle').placeholder=T('titlePh');$('nId').placeholder=T('idPh');
    function hint(id){$('nHint').textContent=T('hint',{u:'/p/'+(id||'…')})}
    hint('');
    function renderMe(){var b=$('meBtn');b.textContent='';b.appendChild(document.createTextNode(me.name||me.person));b.appendChild(el('span',{text:' · '+(L.ac[me.role]||me.role)+' · '+T('profile')}));b.hidden=false;b.title=T('profile')}
    renderMe();
    $('signOut').textContent=T('signOut');$('signOut').hidden=false;$('signOut').onclick=s.signOut;
    $('newSec').hidden=me.role==='viewer';
    $('list').appendChild(el('p',{class:'empty',text:T('loading')}));

    function load(){
      call('GET','/api/projects').then(function(ps){
        var list=$('list');list.textContent='';
        if(!ps.length){list.appendChild(el('p',{class:'empty',text:T('none')}));return}
        ps.forEach(function(p){
          var bar=el('div',{class:'progress','aria-hidden':'true'});
          ['done','review','doing','blocked','todo'].forEach(function(k){var n=p.tasks[k]||0;if(n)bar.appendChild(el('span',{style:'width:'+(n/p.total*100)+'%;background:'+BAR[k]}))});
          var nums=[T('tasks',{n:p.total})].concat(['doing','review','blocked'].filter(function(k){return p.tasks[k]}).map(function(k){return L.st[k]+' '+p.tasks[k]})).concat([T('done',{n:p.tasks.done||0})]);
          list.appendChild(el('a',{class:'card',href:'/p/'+p.id},[
            el('div',{class:'top'},[el('strong',{text:p.title}),el('span',{class:'id',text:'/p/'+p.id})]),
            p.subtitle?el('p',{class:'sub',text:p.subtitle}):null,
            repos(p).length?el('div',{class:'repos'},repos(p).map(function(r){return el('span',{text:r})})):null,
            p.total?bar:null,
            el('div',{class:'nums'},nums.map(function(t){return el('span',{text:t})}).concat(p.last?[el('span',{text:T('last',{t:ago(p.last)})})]:[]))
          ]));
        });
      },function(e){$('list').textContent='';$('list').appendChild(el('p',{class:'err',text:T('loadFail',{e:e.message})}))});
    }
    load();
    document.addEventListener('visibilitychange',function(){if(!document.hidden){load();if(me.role==='admin')loadMembers()}});

    var title=$('nTitle'),id=$('nId'),touched=false;
    title.addEventListener('input',function(){if(touched)return;var g=title.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);id.value=g;hint(g)});
    id.addEventListener('input',function(){touched=true;hint(id.value)});
    $('newForm').addEventListener('submit',function(e){
      e.preventDefault();var err=$('nErr');err.hidden=true;$('nGo').disabled=true;
      call('POST','/api/projects',{id:id.value.trim(),title:title.value.trim()}).then(function(b){location.href='/p/'+b.id},function(e){$('nGo').disabled=false;err.textContent=e.message;err.hidden=false});
    });

    // ---------- profile: the name and role everyone sees; the id and access stay with admins ----------
    function openProfile(){
      var root=$('dialogRoot');root.textContent='';
      var name=el('input',{type:'text',id:'pName',maxlength:'60',placeholder:T('namePh')});name.value=me.name||'';
      var tt=el('input',{type:'text',id:'pTitle',maxlength:'80',placeholder:T('pTitlePh')});tt.value=me.title||'';
      var err=el('p',{class:'err',hidden:''}),ok=el('button',{type:'button',class:'btn primary',text:T('save')});
      function close(){root.textContent='';$('meBtn').focus()}
      ok.addEventListener('click',function(){ok.disabled=true;err.hidden=true;
        call('POST','/api/me',{name:name.value,title:tt.value}).then(function(b){me=b;renderMe();close();if(me.role==='admin')loadMembers()},function(e){ok.disabled=false;err.textContent=T('fail',{e:e.message});err.hidden=false})});
      var dlg=el('div',{class:'dialog',role:'dialog','aria-modal':'true','aria-labelledby':'pHead'},[
        el('h2',{id:'pHead',text:T('profile')}),
        el('p',{class:'fixed',text:T('pFixed',{p:me.person,a:L.ac[me.role]||me.role})}),
        el('div',{class:'fields'},[el('label',{},[T('pName'),name]),el('label',{},[T('pTitle'),tt])]),
        el('p',{class:'hint',text:T('pHint')}),err,
        el('div',{class:'foot'},[ok,el('button',{type:'button',class:'btn',text:T('cancel'),onclick:close})])
      ]);
      dlg.addEventListener('keydown',function(e){if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();ok.click()}});
      root.appendChild(el('div',{class:'scrim',onclick:close}));root.appendChild(dlg);name.focus();
    }
    $('meBtn').addEventListener('click',openProfile);
    // the full profile (with the role shown on boards) comes from the server, whatever signed the viewer in
    call('GET','/api/me').then(function(b){me=b;renderMe()},function(){});

    // ---------- members (admins): the same steps as `artiboard member …`, on the page ----------
    if(me.role!=='admin')return;
    $('memSec').hidden=false;$('hMembers').textContent=T('members');$('memSub').textContent=T('memSub');
    var th=$('memHead');L.th.forEach(function(x){th.appendChild(el('th',{text:x}))});
    $('lPerson').textContent=T('person');$('lName').textContent=T('name');$('lAccess').textContent=T('access');$('mGo').textContent=T('add');$('mHint').textContent=T('memHint');
    $('mPerson').placeholder=T('personPh');$('mName').placeholder=T('namePh');
    [].forEach.call($('mAccess').options,function(o){o.textContent=L.ac[o.value]});

    function reveal(head,parts){
      var r=$('reveal');r.textContent='';r.hidden=false;
      r.appendChild(el('div',{class:'head'},[el('h3',{text:head}),el('span',{class:'once',text:T('once')}),el('button',{type:'button',class:'linkbtn x',text:T('close'),onclick:function(){r.hidden=true;r.textContent=''}})]));
      parts.forEach(function(p){r.appendChild(p)});
      r.scrollIntoView({block:'nearest'});
    }
    function line(k,text,pre){return el('div',{class:'step'},[el('span',{class:'k',text:k}),el('div',{class:'line'},[el(pre?'pre':'code',{text:text}),copyBtn(text)])])}
    function showToken(p,b){
      reveal(T('tokenFor',{p:p}),[line(T('tokenK'),b.token),line(T('claudeK'),b.connect.claude,true),line(T('codexK'),b.connect.codex.join('\n'),true),el('p',{class:'ok',text:T('browserK',{u:location.origin})})]);
    }
    function act(btn,fn){btn.disabled=true;return fn().then(null,function(e){alert(T('fail',{e:e.message}))}).then(function(){btn.disabled=false})}
    function loadMembers(){
      call('GET','/api/members').then(function(ms){
        var body=$('memRows');body.textContent='';
        ms.forEach(function(m){
          var mine=m.uid===me.uid,p=m.person;
          var sel=el('select',{'aria-label':T('access'),disabled:mine?'':null});
          ['member','admin','viewer'].forEach(function(a){sel.appendChild(el('option',{value:a,text:L.ac[a]}))});sel.value=m.role;
          sel.addEventListener('change',function(){act(sel,function(){return call('POST','/api/members/'+p+'/access',{access:sel.value}).then(loadMembers)})});
          body.appendChild(el('tr',{},[
            el('td',{class:'person'},[p,' ',mine?el('span',{class:'tag me',text:T('meTag')}):null]),
            el('td',{class:'name'},[m.name||'—',m.title?el('span',{class:'title',text:m.title}):null]),
            el('td',{},[el('span',{class:'tag '+m.role,text:L.ac[m.role]||m.role})]),
            el('td',{text:String(m.tokens)}),
            el('td',{class:'empty',text:m.lastUsed?ago(m.lastUsed):T('never')}),
            el('td',{class:'actions'},[
              el('button',{type:'button',class:'btn small',text:T('newToken'),onclick:function(e){act(e.currentTarget,function(){return call('POST','/api/members/'+p+'/token').then(function(b){showToken(p,b);loadMembers()})})}}),
              el('button',{type:'button',class:'btn small',text:T('link'),onclick:function(e){act(e.currentTarget,function(){return call('POST','/api/members/'+p+'/link').then(function(b){reveal(T('linkFor',{p:p}),[line(T('linkK'),b.url)])})})}}),
              sel,
              el('button',{type:'button',class:'btn small',text:T('revoke'),onclick:function(e){if(!confirm(T('confirmRevoke',{p:p})))return;act(e.currentTarget,function(){return call('POST','/api/members/'+p+'/revoke').then(loadMembers)})}}),
              mine?null:el('button',{type:'button',class:'btn small danger',text:T('remove'),onclick:function(e){if(!confirm(T('confirmRemove',{p:p})))return;act(e.currentTarget,function(){return call('POST','/api/members/'+p+'/remove').then(loadMembers)})}})
            ])
          ]));
        });
      },function(e){var body=$('memRows');body.textContent='';body.appendChild(el('tr',{},[el('td',{colspan:'6',class:'err',text:T('loadFail',{e:e.message})})]))});
    }
    loadMembers();
    $('memForm').addEventListener('submit',function(e){
      e.preventDefault();var err=$('mErr');err.hidden=true;$('mGo').disabled=true;
      var person=$('mPerson').value.trim();
      call('POST','/api/members',{person:person,name:$('mName').value.trim(),access:$('mAccess').value}).then(function(b){
        $('mGo').disabled=false;$('mPerson').value='';$('mName').value='';
        reveal(T('added',{p:person}),[line(T('tokenK'),b.token),line(T('claudeK'),b.connect.claude,true),line(T('codexK'),b.connect.codex.join('\n'),true),el('p',{class:'ok',text:T('browserK',{u:location.origin})})]);
        loadMembers();
      },function(e){$('mGo').disabled=false;err.textContent=T('fail',{e:e.message});err.hidden=false});
    });
  });
})();
</script>
</body>
</html>
