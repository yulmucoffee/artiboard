name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Manifests are valid JSON
        run: |
          node -e "for (const f of ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','package.json','vercel.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Skill frontmatter has name and description
        run: |
          head -5 skills/artiboard/SKILL.md | grep -q '^name: artiboard$'
          head -5 skills/artiboard/SKILL.md | grep -q '^description: '
      - name: Board script parses
        run: |
          node -e "const s=require('fs').readFileSync('skills/artiboard/assets/board.html','utf8');require('fs').writeFileSync('/tmp/board.js',s.match(/<script>([\s\S]*)<\/script>/)[1])"
          node --check /tmp/board.js
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund jsdom@24.1.1
      - name: npm run check (versions, READMEs, page rules copy, demo, tests on SQLite, page smoke test)
        run: npm run check

  # the same server tests against the second backend: a local Supabase stack with this repository's migrations
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Start Supabase with the migrations
        run: supabase start -x studio,logflare,vector,imgproxy,mailpit,edge-runtime,storage-api
      - name: Tests on SQLite and Supabase
        run: |
          eval "$(sh scripts/supabase-env.sh)"
          AB_SUPABASE=1 npm test
